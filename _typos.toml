[default]
# British spelling everywhere: colour, behaviour, licence as the noun.
locale = "en-gb"
# Spellings that are not ours, each matched whole so that prose around them is still checked:
# steamcmd's and the partner Web API's own messages, quoted as they come, which steamship matches
# and tests against;
# flags and settings of actionlint, cargo, cargo-fuzz and syft; GitHub's upload-artifact action
# and the branding key of an action's metadata; the in-toto file extension; CSS's own
# properties, function and value, in the site's stylesheet and the rules docs-site writes; and
# BinSkim's rule names and its analyze command. And SSH keys and their fingerprints, which are
# base64 rather than words.
extend-ignore-re = [
  'SHA256:[A-Za-z0-9+/]{43}',
  'ssh-ed25519 [A-Za-z0-9+/]+=*',
  '\bBA\d{4}\b',
  '\}" analyze ',
  '\b(?:[a-z]+-)*color(?:-[a-z]+)*\s*:',
  '\bcolor-mix\(',
  ':\s*center\b',
  'Failed to initialize build on server',
  'Unable to find specificed betakey',
  '-color\b',
  '(?m)^  color: ',
  'CARGO_TERM_COLOR',
  '--sanitizer',
  'AddressSanitizer',
  'select-catalogers',
  '[a-z-]+-cataloger\b',
  'upload-artifact',
  '\.intoto\.jsonl',
]

[default.extend-identifiers]
# Other crates' names, which are not ours to spell: sha2's `finalize`, and Windows' own API as
# windows-sys names it.
finalize = "finalize"
InitializeAcl = "InitializeAcl"
InitializeProcThreadAttributeList = "InitializeProcThreadAttributeList"
Authorization = "Authorization"
Win32_Security_Authorization = "Win32_Security_Authorization"
Globalization = "Globalization"
Win32_Globalization = "Win32_Globalization"
# security-framework's name for Apple's iCloud Keychain setting.
set_access_synchronized = "set_access_synchronized"
# anstyle's colour type, and the variable the no-color.org convention names.
AnsiColor = "AnsiColor"
NO_COLOR = "NO_COLOR"

[files]
# Hidden paths too: the workflows' comments are prose like any other.
ignore-hidden = false
# Git's own folder; Valve's files, kept byte for byte as Valve serves them; and the licence
# texts, which are legal wording that must not change by a letter.
extend-exclude = [".git/", "fuzz/seeds/", "pins/", "LICENSE-APACHE", "LICENSE-MIT"]
