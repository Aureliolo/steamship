[default]
# British spelling everywhere: colour, behaviour, licence as the noun.
locale = "en-gb"
# steamcmd's own messages, quoted as it prints them, which steamship matches and tests against.
extend-ignore-re = ["Failed to initialize build on server"]

[default.extend-identifiers]
# Other crates' names, which are not ours to spell: sha2's `finalize`, and Windows' own API as
# windows-sys names it.
finalize = "finalize"
InitializeAcl = "InitializeAcl"
InitializeProcThreadAttributeList = "InitializeProcThreadAttributeList"
Authorization = "Authorization"
Win32_Security_Authorization = "Win32_Security_Authorization"
Globalization = "Globalization"
Win32_Globalization = "Win32_Globalization"
# anstyle's colour type, and the variable the no-color.org convention names.
AnsiColor = "AnsiColor"
NO_COLOR = "NO_COLOR"

[files]
# Valve's own files, kept byte for byte as Valve serves them, and the licence texts, which are
# legal wording that must not change by a letter.
extend-exclude = ["fuzz/seeds/", "pins/", "LICENSE-APACHE", "LICENSE-MIT"]
