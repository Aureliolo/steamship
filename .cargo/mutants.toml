# Mutants no test can tell from the original, each with why. Anything else a mutant survives is a
# missing test.
exclude_re = [
  # Every `|` in this crate joins flags that share no bit, where `^` gives the same value.
  'replace \| with \^',
  # DeleteProcThreadAttributeList releases what the list refers to, and a handle list refers to
  # nothing it owns; the list's own storage is freed either way.
  'replace <impl Drop for AttributeList>::drop with \(\)',
  # LocalFree gives back the memory a security descriptor was read into, and nothing else; a leak
  # changes no behaviour a test could see.
  'replace <impl Drop for Security>::drop with \(\)',
  # CredFree likewise gives back only the memory a credential was read into, which steamship has
  # already copied the key out of and wiped; a leak changes nothing a test could see.
  'replace <impl Drop for Credential>::drop with \(\)',
  # Windows gives each program the console's input mode as it was before any other program
  # changed it, so a mode left unrestored never reaches the shell; and within steamship nothing
  # reads the keyboard after a prompt but the next prompt, which sets its own. On Unix the
  # terminal keeps what it was last set to, and a test sees it.
  'src[/\\]windows\.rs.*replace <impl Drop for Keys>::drop with \(\)',
  # The mark of the running process group is cleared so that a signal after the group has ended
  # cannot reach another given the same number since; no test can make the system reuse one.
  'src[/\\]unix\.rs.*replace <impl Drop for Running>::drop with \(\)',
  # Revocation checking shows only with a revoked certificate, and asking for no window only
  # when Windows would otherwise wait on someone to answer one.
  'replace quietly_to_the_root with \(\)',
  # Reached only when Steam's partner Web API fails, which no test may call; CI's install job
  # has the real API refuse a key that is not one, and checks the exit code there.
  'replace web_api_failed -> ExitCode with Default::default\(\)',
]
