# Every Windows build, the tests' too, is the build that ships: the C runtime linked in, so the
# program runs without the Visual C++ redistributable, and Control Flow Guard, which checks each
# indirect call lands at the start of a function. The linker's own mitigations are in build.rs,
# which also covers a build from the published crate.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "control-flow-guard"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "control-flow-guard"]

# The C that ring compiles with MSVC, with the compiler's Spectre mitigations. The C runtime linked
# in has them too where Visual Studio's Spectre-mitigated libraries are installed, as on GitHub's
# runners, where CI and the release ask for them (VSCMD_ARG_VCVARS_SPECTRE); without them, a
# build here would not link.
[env]
CFLAGS_x86_64_pc_windows_msvc = "/Qspectre"
CFLAGS_aarch64_pc_windows_msvc = "/Qspectre"
