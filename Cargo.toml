[package]
name = "steamship"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
description = "Uploads game builds to Steam with Valve's steamcmd, set up pinned and verified, with a clear result and no passwords."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aureliolo/steamship"
readme = "README.md"
keywords = ["steam", "steamworks", "steamcmd", "gamedev", "deploy"]
categories = ["command-line-utilities", "game-development", "development-tools::build-utils"]
include = ["/src", "/LICENSE-APACHE", "/LICENSE-MIT", "/README.md"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# From the restriction group: a panic is a bug report the user cannot act on, so errors travel
# as values, and printing is confined to the command line layer.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
