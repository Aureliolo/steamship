[package]
name = "steamship"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
description = "Uploads game builds to Steam with Valve's steamcmd, set up pinned and verified, with a clear result and no passwords."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aureliolo/steamship"
readme = "README.md"
keywords = ["steam", "steamworks", "steamcmd", "gamedev", "deploy"]
categories = ["command-line-utilities", "game-development", "development-tools::build-utils"]
include = ["/src", "/pins", "/LICENSE-APACHE", "/LICENSE-MIT", "/README.md"]

[dependencies]
# Already in the tree through clap: colour that turns itself off when the output is not a
# terminal, or NO_COLOR is set.
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "env"] }
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# Valve's packages use only stored and deflated entries, so one pure-Rust decoder is all it needs.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Wipes the typed password from memory once it has been passed to steamcmd.
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
# Already in the tree through ring and sha2; stopping a process group has no std API.
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Already in the tree through clap, so Windows' own APIs cost no crate that was not there.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Diagnostics_Debug",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[target.'cfg(windows)'.dev-dependencies]
# Windows' own argument parser, which the tests hold the command line steamship writes against,
# and its window list, which they search for anything a program run out of sight has shown.
windows-sys = { version = "0.61.2", features = [
  "Win32_Globalization",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

# The fuzz harness is a member so that it is held to the same lints from the one table below.
# Plain cargo commands build only this crate; the harness needs libFuzzer and is built by
# cargo-fuzz.
[workspace]
members = [".", "fuzz"]
default-members = ["."]

# Every lint group is on, the restriction group included, and CI turns every warning into an
# error. The exceptions below are the only ones, and each says why, so a future exception has to
# argue for itself rather than being appended quietly.

[workspace.lints.rust]
# unused_crate_dependencies is left off: it judges each target alone, so clap counts as unused in
# the library and proptest in the binary. cargo-machete checks the manifest as a whole in CI.
unsafe_code = "deny"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
# Clippy warns against enabling the whole restriction group because some of its lints contradict
# each other or Rust's own idioms. It is enabled on purpose; the ones that do are the ones below.
blanket_clippy_restriction_lints = "allow"
# Each of these has an opposite in the same group (needless_return, unseparated_literal_suffix,
# the other byte order), so one of every pair has to go. The halves kept are the idiomatic ones.
implicit_return = "allow"
separated_literal_suffix = "allow"
# The ELF reader reads a format that states its own byte order in its header, so both orders are
# spelled out on purpose; host_endian_bytes, the one that would be a bug, stays on.
big_endian_bytes = "allow"
little_endian_bytes = "allow"
# `?` is how an error travels as a value. Banning it means a match per call doing the same.
question_mark_used = "allow"
# A comment earns its place by saying something the code does not. A doc comment on every private
# item mostly restates the item's name, which is the noise that rule exists to prevent.
missing_docs_in_private_items = "allow"
# Items read top down, the entry point first and its helpers after; alphabetical order would put
# them anywhere.
arbitrary_source_item_ordering = "allow"
# A hint for callers in other crates, and this library has none (see src/lib.rs).
missing_inline_in_public_items = "allow"
# A function that is called once still names a step, which is why it was split out.
single_call_fn = "allow"
# Unit tests in an inline `mod tests` is the Rust convention; integration tests live in tests/,
# which is a crate of its own and so is "outside a cfg(test) module" by construction.
inline_modules = "allow"
tests_outside_test_module = "allow"
# Match ergonomics are the language's default way to match on a reference.
pattern_type_mismatch = "allow"
# Asks every trait implementation to restate the trait's default methods.
missing_trait_methods = "allow"
# The library API is internal and changes with any release (see src/lib.rs), so there is no
# downstream to protect by marking types non-exhaustive.
exhaustive_enums = "allow"
exhaustive_structs = "allow"
# This is a std program for three desktop systems, never no_std.
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
# Rebinding a value to its refined form (`let text = text.trim()`) keeps the raw one out of reach.
# Shadowing with an unrelated value, the kind that misleads, stays refused.
shadow_reuse = "allow"
# A module's error type is called Error, as the standard library's io::Error and fmt::Error are.
# module_name_repetitions refuses the alternative (download::DownloadError), so one has to go.
error_impl_error = "allow"
# cargo-deny's bans check owns duplicate versions: its exceptions name the exact version with a
# reason, and fail once they stop matching, where this lint could only be silenced by crate name.
multiple_crate_versions = "allow"

[package.metadata.binstall]
# `cargo binstall steamship` downloads this repository's own release archive, never a build from
# a third-party host; a target with no archive falls back to building from source.
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

# The one Linux archive is static, and serves a glibc system as well.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-{ version }-x86_64-unknown-linux-musl/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.zip"
pkg-fmt = "zip"

# `cargo install` builds with this profile, so it stays quick: whole-program optimisation nearly
# triples the build for an 11% smaller binary. The release archives are built with `dist`, which
# adds it; `cargo install --locked steamship --profile dist` builds the same from source.
[profile.release]
strip = true

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
