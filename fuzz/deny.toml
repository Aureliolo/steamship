# The fuzz harness, which is never published or shipped. It differs from the crate's policy in
# two places: libFuzzer comes from LLVM under the NCSA licence, and the harness reaches the crate
# by path, which carries no version.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "NCSA", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
