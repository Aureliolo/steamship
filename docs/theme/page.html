<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{canonical}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="site.css" />
    <link rel="icon" href="ship.svg" type="image/svg+xml" />
  </head>
  <body{{bodyclass}}>
    <a class="skip" href="#content">Skip to the content</a>
    <header class="top">
      <div class="bar">
        <a class="wordmark" href="index.html"
          ><pre class="ship" aria-hidden="true">{{ship}}</pre>
          <span>steamship</span> <span class="version">{{version}}</span></a
        >
        <nav class="links" aria-label="Pages">
          {{toplinks}}
          <span class="off" aria-hidden="true"></span>
          <a class="out" href="https://github.com/Aureliolo/steamship/releases">Releases</a>
          <a class="out" href="https://github.com/Aureliolo/steamship">Source</a>
        </nav>
      </div>
    </header>
    <main id="content">{{content}}</main>
    <footer class="foot">
      <div class="bar">
        <span>steamship {{version}}</span>
        <span>steamcmd pinned and verified</span>
        <span>Sigstore signed, SLSA Build L3</span>
        <span>MIT or Apache-2.0</span>
      </div>
    </footer>
  </body>
</html>
