name: Test prerequisites
description: >-
  Installs what the tests need beyond Rust on this runner, and nothing where the runner has it
  already. Every job that runs the tests uses this, the release build too, so a prerequisite
  added here reaches all of them.

runs:
  using: composite
  steps:
    # The Secret Service a Linux desktop keeps secrets in, and steamship the Web API key: D-Bus
    # and GNOME Keyring, from the image's own signed Ubuntu archive, as musl-tools is. The tests
    # start a bus and a keyring of their own from these. secret-tool is libsecret's, a second
    # client of the same store for steps that check what steamship kept. Windows' Credential
    # Manager and the macOS Keychain are there on their runners already.
    - name: Install D-Bus and GNOME Keyring
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends dbus-daemon gnome-keyring libsecret-tools
