name: Test prerequisites
description: >-
  Installs what the tests need beyond Rust on this runner, and nothing where the runner has it
  already. Every job that runs the tests uses this, so a prerequisite added here reaches all of
  them.

outputs:
  conpty:
    description: The folder holding Microsoft's ConPTY on Windows, for STEAMSHIP_TEST_CONPTY, and empty elsewhere
    value: ${{ steps.conpty.outputs.folder }}

runs:
  using: composite
  steps:
    # The Secret Service a Linux desktop keeps secrets in, and steamship the Web API key: D-Bus
    # and GNOME Keyring. The tests start a bus and a keyring of their own from these.
    # secret-tool is libsecret's, a second client of the same store for steps that check what
    # steamship kept. Windows' Credential Manager and the macOS Keychain are there on their
    # runners already.
    - name: Install D-Bus and GNOME Keyring
      if: runner.os == 'Linux'
      uses: ./.github/actions/apt-packages # zizmor: ignore[self-repository]
      with:
        packages: dbus-daemon gnome-keyring libsecret-tools

    # Microsoft's console, which the tests make their pseudo consoles through, as an installed
    # steamship does.
    - name: Fetch Microsoft's ConPTY
      id: conpty
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_ARCH}" in
          X64) architecture=x64 ;;
          ARM64) architecture=arm64 ;;
          *) echo "No ConPTY package for ${RUNNER_ARCH}." >&2; exit 1 ;;
        esac
        bash .github/conpty.sh "${architecture}" "${RUNNER_TEMP}/conpty"
        echo "folder=${RUNNER_TEMP}/conpty" >> "${GITHUB_OUTPUT}"
