name: AUR package
description: >-
  Builds steamship-bin from a PKGBUILD and .SRCINFO written by .github/packages.sh, lints it with
  namcap, checks the .SRCINFO is what makepkg prints, and installs and uses it on a bare Arch
  Linux, before anything is pushed to the AUR.

inputs:
  folder:
    description: The folder holding the PKGBUILD and .SRCINFO, and the Linux archive when it is not to be downloaded
    required: true

runs:
  using: composite
  steps:
    - name: Build, lint, install and use it on Arch Linux
      shell: bash
      env:
        FOLDER: ${{ inputs.folder }}
        # renovate: datasource=docker depName=archlinux
        ARCH: archlinux:base-devel@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50
      # Without Docker's seccomp filter, for the reason the linux-packages action gives.
      run: |
        set -euo pipefail
        docker run --rm --security-opt seccomp=unconfined \
          --volume "$(realpath "${FOLDER}"):/aur:ro" \
          --volume "$(realpath "${GITHUB_ACTION_PATH}/../../aur-try.sh"):/try.sh:ro" \
          --volume "${GITHUB_WORKSPACE}/tests/fixtures/spacewar:/spacewar:ro" \
          "${ARCH}" bash /try.sh
