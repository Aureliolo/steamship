name: Packages

# The Homebrew formula and the Scoop manifest, installed the way a user installs them, on the
# systems they are for. On a pull request that touches them, the committed files, checked first
# against what the release they name is signed over. Called by the release, the files it wrote
# for itself, before they reach main.
on:
  pull_request:
    paths:
      - Formula/**
      - bucket/**
      - .github/packages.sh
      - .github/workflows/packages.yml
      - .github/workflows/release.yml
      - .github/workflows/release-build.yml
  workflow_call:
    inputs:
      files:
        description: The uploaded files holding Formula/ and bucket/, installed in place of the committed ones
        type: string
        required: true
      tag:
        description: The release whose attached steamship.json Scoop also installs from, by its address
        type: string
        required: true

permissions: {}

# Its own group: called by the release, `github.workflow` is the release's name, and a group
# matching the release's own would hold this run behind the run that called it.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Scoop's own code, pinned by commit; its installer always fetches the tip of master, so it is
  # not used. The pin is raised by Renovate from the tag.
  # renovate: datasource=github-tags depName=ScoopInstaller/Scoop
  SCOOP_TAG: v0.6.0
  SCOOP_COMMIT: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f

jobs:
  # A pull request can change the files by hand; what reaches users has to be exactly what the
  # release's own signed checksums say, written by the script as it was at that release's tag. A
  # change to the script shows in the next release, which installs what it wrote before merging.
  signed:
    name: packages (signed)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the files, and the public release they name.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the files are what the release they name is signed over
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version bucket/steamship.json)"
          tag="v${version}"
          mkdir release written
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir release \
            --pattern '*.sha256' --pattern "steamship-${version}.intoto.jsonl"
          for sum in release/*.sha256; do
            gh attestation verify "${sum}" --bundle "release/steamship-${version}.intoto.jsonl" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml" \
              --source-ref "refs/tags/${tag}" --deny-self-hosted-runners
          done
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${GITHUB_REPOSITORY}/contents/.github/packages.sh?ref=${tag}" > "${RUNNER_TEMP}/packages.sh"
          bash "${RUNNER_TEMP}/packages.sh" "${version}" release written
          diff -u written/Formula/steamship.rb Formula/steamship.rb
          diff -u written/bucket/steamship.json bucket/steamship.json

  homebrew:
    name: packages (homebrew ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-26.04
          - platform: macos
            # renovate: datasource=github-runners depName=macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # Reads the formula.
    env:
      # Homebrew as the runner image ships it: it has no version to pin, and an update would
      # change it between runs.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the release's formula
        if: inputs.files != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.files }}

      # Homebrew clones a tap, so the formula has to be committed, on a branch the clone checks
      # out; a user's tap is the same repository at its default branch.
      - name: Tap this repository and install from it
        run: |
          set -euo pipefail
          if ! command -v brew > /dev/null; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew --version
          git switch --quiet --create packages-check
          git add Formula/steamship.rb
          git -c user.name=packages -c user.email=packages@localhost commit --quiet --allow-empty \
            --message 'The formula under test'
          version="$(jq -r .version bucket/steamship.json)"
          brew tap aureliolo/steamship "${GITHUB_WORKSPACE}"
          brew install aureliolo/steamship/steamship
          test "$(steamship --version)" = "steamship ${version}"
          # A glob that matches nothing installs nothing without a word, so what the formula says
          # it installs is looked for where Homebrew puts it.
          if grep -q 'man1.install' Formula/steamship.rb; then
            prefix="$(brew --prefix)"
            test -f "${prefix}/share/man/man1/steamship.1"
            test -f "${prefix}/share/man/man1/steamship-upload.1"
            test -f "${prefix}/etc/bash_completion.d/steamship"
            test -f "${prefix}/share/zsh/site-functions/_steamship"
            test -f "${prefix}/share/fish/vendor_completions.d/steamship.fish"
          fi
          brew test aureliolo/steamship/steamship
          brew audit --strict aureliolo/steamship/steamship
          # The other systems' archives, downloaded and checked against their SHA-256 here, since
          # no runner is each of them.
          brew fetch --force --os=macos --arch=intel aureliolo/steamship/steamship
          brew fetch --force --os=macos --arch=arm aureliolo/steamship/steamship
          brew fetch --force --os=linux --arch=intel aureliolo/steamship/steamship
          brew uninstall aureliolo/steamship/steamship
          brew untap aureliolo/steamship

  scoop:
    name: packages (scoop ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
            machine: 0x8664
          - architecture: arm64
            runner: windows-11-arm
            machine: 0xAA64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # Reads the manifest.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the release's manifest
        if: inputs.files != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.files }}

      - name: Install Scoop at its pinned commit
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $core = "$env:RUNNER_TEMP\scoop\apps\scoop\current"
          git init --quiet $core
          git -C $core fetch --quiet --depth 1 https://github.com/ScoopInstaller/Scoop.git $env:SCOOP_COMMIT
          git -C $core checkout --quiet FETCH_HEAD
          if ((git -C $core rev-parse HEAD) -ne $env:SCOOP_COMMIT) { throw 'Scoop is not at its pinned commit.' }
          # The folders Scoop's installer makes that Scoop itself expects to find.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\scoop\shims", "$env:RUNNER_TEMP\scoop\buckets" | Out-Null

      # By address first, as the README gives it: from the release itself when there is one, the
      # file when there is not. Then as a bucket, this repository added the way a user adds it.
      - name: Install by address, then from this repository as a bucket
        env:
          TAG: ${{ inputs.tag }}
          ARCHITECTURE: ${{ matrix.architecture }}
          MACHINE: ${{ matrix.machine }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:SCOOP = "$env:RUNNER_TEMP\scoop"
          $scoop = "$env:SCOOP\apps\scoop\current\bin\scoop.ps1"
          $manifest = Get-Content bucket/steamship.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          # A manifest with no arm64 build installs the x64 one on Arm, which Windows emulates.
          $machine = if ($manifest.architecture.$env:ARCHITECTURE) { [int]$env:MACHINE } else { 0x8664 }
          # scoop.ps1 is a script, not a program, so a failure shows only in its exit code.
          function Scoop {
            & $scoop @args
            if ($LASTEXITCODE -ne 0) { throw "scoop $args failed with $LASTEXITCODE." }
          }
          function Check {
            $said = & "$env:SCOOP\shims\steamship.exe" --version
            if ($said -ne "steamship $version") { throw "steamship said '$said' rather than version $version." }
            $program = [IO.File]::ReadAllBytes("$env:SCOOP\apps\steamship\current\steamship.exe")
            $found = [BitConverter]::ToUInt16($program, [BitConverter]::ToInt32($program, 0x3C) + 4)
            if ($found -ne $machine) { throw ('Scoop installed a build for machine 0x{0:X4}, not 0x{1:X4}.' -f $found, $machine) }
          }

          $address = if ($env:TAG) {
            "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/steamship.json"
          } else {
            (Resolve-Path bucket/steamship.json).Path
          }
          Scoop install --no-update-scoop $address
          Check
          Scoop uninstall steamship

          git switch --quiet --create packages-check
          git add bucket/steamship.json
          git -c user.name=packages -c user.email=packages@localhost commit --quiet --allow-empty `
            --message 'The manifest under test'
          # Scoop takes a bucket only by a Git URL, which a plain path is not.
          Scoop bucket add aureliolo ("file:///" + ($env:GITHUB_WORKSPACE -replace '\\', '/'))
          Scoop install --no-update-scoop aureliolo/steamship
          Check
          Scoop uninstall steamship

  # winget's own validation installs a new package and starts its program with no arguments,
  # failing one that exits otherwise than 0 within 10 seconds; this does the same before the
  # manifests reach winget-pkgs.
  winget:
    name: packages (winget ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # Reads the manifests, and the public release a pull request writes them from.
    defaults:
      run:
        shell: pwsh
    env:
      # winget itself, used only where the runner image lacks it. Raised by Renovate from the tag.
      # renovate: datasource=github-releases depName=microsoft/winget-cli
      WINGET_TAG: v1.29.380
      WINGET_BUNDLE_SHA256: 65dea9c01ce08ee7b763366b27c0e651f97db857c11ca9b9c301826c10092f2e
      WINGET_DEPENDENCIES_SHA256: ba875afe9d190f61218985ac0292a99d1db710bf93e13c68944ca9d89f0d82d1
      WINGET_LICENSE: e53e159d00e04f729cc2180cffd1c02e_License1.xml
      WINGET_LICENSE_SHA256: bcb15118ec47df24e3e6013a7006147c3a15b3a8104ed660fe87c8b4ed01f485

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the release's manifests
        if: inputs.files != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.files }}

      # On a pull request no manifests are committed, so they are written as the next release
      # writes them, from the signed checksums of the release the bucket names.
      - name: Write the manifests for the release the bucket names
        if: inputs.files == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version bucket/steamship.json)"
          mkdir release written
          gh release download "v${version}" --repo "${GITHUB_REPOSITORY}" --dir release \
            --pattern '*.sha256' --pattern "steamship-${version}.intoto.jsonl"
          for sum in release/*.sha256; do
            gh attestation verify "${sum}" --bundle "release/steamship-${version}.intoto.jsonl" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml" \
              --source-ref "refs/tags/v${version}" --deny-self-hosted-runners
          done
          bash .github/packages.sh "${version}" release written
          mv written/winget winget

      - name: Install winget where the runner lacks it
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command winget -ErrorAction SilentlyContinue) { winget --version; exit 0 }
          $base = "https://github.com/microsoft/winget-cli/releases/download/$env:WINGET_TAG"
          $files = @{
            'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' = $env:WINGET_BUNDLE_SHA256
            'DesktopAppInstaller_Dependencies.zip' = $env:WINGET_DEPENDENCIES_SHA256
            $env:WINGET_LICENSE = $env:WINGET_LICENSE_SHA256
          }
          foreach ($name in $files.Keys) {
            $path = "$env:RUNNER_TEMP\$name"
            Invoke-WebRequest -Uri "$base/$name" -OutFile $path
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($hash -ne $files[$name]) { throw "$name hashes to $hash, not the pinned $($files[$name])." }
          }
          Expand-Archive "$env:RUNNER_TEMP\DesktopAppInstaller_Dependencies.zip" "$env:RUNNER_TEMP\dependencies"
          $machine = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $dependencies = Get-ChildItem "$env:RUNNER_TEMP\dependencies\$machine" -Filter *.appx | ForEach-Object FullName
          Add-AppxProvisionedPackage -Online -PackagePath "$env:RUNNER_TEMP\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" `
            -DependencyPackagePath $dependencies -LicensePath "$env:RUNNER_TEMP\$env:WINGET_LICENSE" | Out-Null
          Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe
          "$env:LOCALAPPDATA\Microsoft\WindowsApps" >> $env:GITHUB_PATH

      - name: Install with winget, then start steamship as winget's validation does
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          winget --version
          winget settings --enable LocalManifestFiles
          winget install --manifest winget --architecture $env:ARCHITECTURE --disable-interactivity `
            --accept-package-agreements --accept-source-agreements
          $version = (Get-Content bucket/steamship.json -Raw | ConvertFrom-Json).version
          $steamship = "$env:LOCALAPPDATA\Microsoft\WinGet\Links\steamship.exe"
          $said = & $steamship --version
          if ($said -ne "steamship $version") { throw "steamship said '$said' rather than version $version." }
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($attempt in 1..5) {
            & $steamship | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "steamship with no arguments exited $LASTEXITCODE on attempt $attempt." }
          }
          $PSNativeCommandUseErrorActionPreference = $true
          winget uninstall --manifest winget --disable-interactivity
