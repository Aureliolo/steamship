name: Mutants

# Coverage says a line ran; this says a test would notice if it were wrong. cargo-mutants changes
# the code one small way at a time (a condition flipped, a return value replaced) and fails when
# the tests still pass. A pull request is held to it on the lines it changes; the whole crate is
# run weekly, which is where anything the diffs never touched turns up.
#
# Code for one system is compiled only there, and mutating code that is not compiled would always
# look missed. So Linux mutates everything but the Windows module, and Windows mutates that module
# alone: the code both systems share is mutated once, on Linux, where the tests that run the whole
# command against a stand-in steamcmd can run.
#
# A mutant that makes the downloader retry sits through its real waits, about a minute in all,
# before the test fails; the minimum timeout is set above that so such a mutant counts as caught
# rather than timed out. Two mutants are built and tested at a time, one for each pair of the
# runner's four cores.
on:
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:
  schedule:
    - cron: '41 3 * * 2'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: mutants (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-26.04
            scope: --exclude
          - platform: windows
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
            scope: --file
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read # Reads the source it mutates, and the base branch to diff against.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install

      - name: Install cargo-mutants
        if: runner.os == 'Linux'
        env:
          # renovate: datasource=github-release-attachments depName=sourcefrog/cargo-mutants versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          CARGO_MUTANTS_TAG: v27.1.0
          CARGO_MUTANTS_SHA256: dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${archive}" \
            "https://github.com/sourcefrog/cargo-mutants/releases/download/${CARGO_MUTANTS_TAG}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Install cargo-mutants
        if: runner.os == 'Windows'
        env:
          # renovate: datasource=github-release-attachments depName=sourcefrog/cargo-mutants versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          CARGO_MUTANTS_TAG: v27.1.0
          CARGO_MUTANTS_SHA256: 2a2f00e47d4b458262a41501b0820aa26015fd35779903d2c8b30b2993f36791
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cargo-mutants-x86_64-pc-windows-msvc.zip"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${archive}" \
            "https://github.com/sourcefrog/cargo-mutants/releases/download/${CARGO_MUTANTS_TAG}/cargo-mutants-x86_64-pc-windows-msvc.zip"
          echo "${CARGO_MUTANTS_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "${archive}" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Mutate what the pull request changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCOPE: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          git diff "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/change.diff"
          cargo mutants --in-diff "${RUNNER_TEMP}/change.diff" "${SCOPE}" src/windows.rs \
            --no-shuffle --minimum-test-timeout 120 --jobs 2

      - name: Mutate everything
        if: github.event_name == 'schedule'
        env:
          SCOPE: ${{ matrix.scope }}
        run: cargo mutants "${SCOPE}" src/windows.rs --no-shuffle --minimum-test-timeout 120 --jobs 2

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-${{ matrix.platform }}
          path: mutants.out/
          if-no-files-found: ignore
