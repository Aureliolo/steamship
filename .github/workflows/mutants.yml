name: Mutants

# Coverage says a line ran; this says a test would notice if it were wrong. cargo-mutants changes
# the code one small way at a time (a condition flipped, a return value replaced) and fails when
# the tests still pass. A pull request is held to it on the lines it changes; the whole crate is
# run weekly, which is where anything the diffs never touched turns up.
#
# Code for one system is compiled only there, and mutating code that is not compiled would always
# look missed. So Linux mutates everything but the Windows and macOS modules, and Windows and macOS
# each mutate their own module alone: the code the systems share is mutated once, on Linux, where
# the tests that run the whole command against a stand-in steamcmd can run.
#
# A mutant that makes the downloader retry sits through its real waits, about a minute in all,
# before the test fails; the minimum timeout is set above that so such a mutant counts as caught
# rather than timed out. Two mutants are built and tested at a time, one for each pair of the
# runner's four cores.
#
# The whole crate is too much for one job: Linux's share was 3,805 mutants on 2026-11-20, at about
# 20 s each with two at a time. So the weekly run splits each system's share into shards of what
# that system's runner gets through in about an hour, dealt out in turn so that the slow mutants
# spread across them, and gives each two hours. The plan counts each share afresh, since a fixed
# number of shards would outgrow its two hours as the crate grows.
on:
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:
  schedule:
    - cron: '41 3 * * 2'
  # The weekly run, started by hand.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that leaves a system's own module alone gives that system nothing to mutate,
  # and macOS would still spend a scarce runner building cargo-mutants to find so.
  plan:
    name: mutants plan
    # A release's own pull requests, opened by the packaging app on a branch of this repository,
    # change no code to mutate: they raise the version, or write the Homebrew and Scoop files.
    # The passed job below counts a skipped one as passed.
    if: >-
      ${{ !(github.event.pull_request.head.repo.full_name == github.repository
      && (startsWith(github.head_ref, 'packages/v') || startsWith(github.head_ref, 'release/v'))
      && github.event.pull_request.user.login == 'aurelios-git-bot[bot]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Lists the mutants of the weekly run's source.
      pull-requests: read # Lists the files the pull request changes.
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        if: github.event_name != 'pull_request'
        run: bash .github/rust-install.sh

      # Listing reads the source without compiling it, so Linux lists each system's share, its own
      # module included.
      - name: Install cargo-mutants
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          bash .github/tool-download.sh sourcefrog/cargo-mutants "$(bash .github/pin.sh CARGO_MUTANTS_LINUX_TAG)" \
            "${archive}" "$(bash .github/pin.sh CARGO_MUTANTS_LINUX_SHA256)" "${RUNNER_TEMP}"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # The systems are listed here rather than in the matrix: a matrix's include entries are
      # added after its exclusions, so one cannot leave out a system that an include describes.
      - name: Plan a job for each shard of each system with something to mutate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          # renovate: datasource=github-runners depName=ubuntu
          LINUX_RUNNER: ubuntu-26.04
          # renovate: datasource=github-runners depName=windows
          WINDOWS_RUNNER: windows-2025
          # renovate: datasource=github-runners depName=macos
          MACOS_RUNNER: macos-26
        run: |
          set -euo pipefail
          changed=''
          if [[ -n "${PULL_REQUEST}" ]]; then
            changed="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PULL_REQUEST}/files" \
              --jq '.[].filename')"
          fi
          # A shard holds what its system's runner mutates in about an hour, as measured on
          # 2026-11-20: Linux about 20 s a mutant, Windows about 40 s, macOS about 30 s.
          systems="$(jq -cn --arg changed "${changed}" --arg pull "${PULL_REQUEST}" \
            '($changed | split("\n")) as $changed
             | [{platform: "linux", runner: env.LINUX_RUNNER, per_shard: 180,
                 mutate: "--exclude src/windows.rs --exclude src/macos.rs"},
                {platform: "windows", runner: env.WINDOWS_RUNNER, per_shard: 90,
                 mutate: "--file src/windows.rs", module: "src/windows.rs"},
                {platform: "macos", runner: env.MACOS_RUNNER, per_shard: 50,
                 mutate: "--file src/macos.rs", module: "src/macos.rs"}]
             | map(select($pull == "" or .module == null
                          or (.module as $module | $changed | index($module)))
                   | del(.module))')"
          jobs='[]'
          while read -r system; do
            shards=1
            if [[ -z "${PULL_REQUEST}" ]]; then
              read -ra mutate <<< "$(jq -r .mutate <<< "${system}")"
              count="$(cargo mutants --list "${mutate[@]}" | wc -l)"
              per_shard="$(jq -r .per_shard <<< "${system}")"
              shards=$(( (count + per_shard - 1) / per_shard ))
              echo "$(jq -r .platform <<< "${system}"): ${count} mutants, shards: ${shards}"
            fi
            jobs="$(jq -c --argjson system "${system}" --argjson shards "${shards}" \
              '. + [range($shards) | $system + {shard: ., shards: $shards} | del(.per_shard)]' \
              <<< "${jobs}")"
          done < <(jq -c '.[]' <<< "${systems}")
          echo "Mutating on: $(jq -r 'map(.platform) | unique | join(", ")' <<< "${jobs}")"
          echo "jobs=${jobs}" >> "${GITHUB_OUTPUT}"

  mutants:
    # A pull request's one job for each system is named by the system alone.
    name: mutants (${{ matrix.platform }}${{ github.event_name != 'pull_request' && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 120 }}
    permissions:
      contents: read # Reads the source it mutates, and the base branch to diff against.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        run: bash .github/rust-install.sh

      - name: Install cargo-mutants
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          bash .github/tool-download.sh sourcefrog/cargo-mutants "$(bash .github/pin.sh CARGO_MUTANTS_LINUX_TAG)" \
            "${archive}" "$(bash .github/pin.sh CARGO_MUTANTS_LINUX_SHA256)" "${RUNNER_TEMP}"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Install cargo-mutants
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="cargo-mutants-x86_64-pc-windows-msvc.zip"
          bash .github/tool-download.sh sourcefrog/cargo-mutants "$(bash .github/pin.sh CARGO_MUTANTS_WINDOWS_TAG)" \
            "${archive}" "$(bash .github/pin.sh CARGO_MUTANTS_WINDOWS_SHA256)" "${RUNNER_TEMP}"
          unzip -q "${RUNNER_TEMP}/${archive}" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # No arm64 macOS build is released, so it is built from source at an exact version, every
      # dependency held to the hashes in its lock file.
      - name: Install cargo-mutants
        if: runner.os == 'macOS'
        env:
          # renovate: datasource=crate depName=cargo-mutants
          CARGO_MUTANTS_VERSION: 27.1.0
        run: cargo install cargo-mutants --version "${CARGO_MUTANTS_VERSION}" --locked

      # Each run of the tests starts a keyring of its own from these, so that one a mutant brings
      # down cannot take the runs after it down too.
      - name: Install the test prerequisites
        id: prerequisites
        uses: ./.github/actions/test-prerequisites # zizmor: ignore[self-repository]

      - name: Mutate what the pull request changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATE: ${{ matrix.mutate }}
          STEAMSHIP_TEST_CONPTY: ${{ steps.prerequisites.outputs.conpty }}
        run: |
          set -euo pipefail
          read -ra mutate <<< "${MUTATE}"
          git diff "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/change.diff"
          cargo mutants --in-diff "${RUNNER_TEMP}/change.diff" "${mutate[@]}" \
            --no-shuffle --minimum-test-timeout 120 --jobs 2

      - name: Mutate everything, one shard
        if: github.event_name != 'pull_request'
        env:
          MUTATE: ${{ matrix.mutate }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          STEAMSHIP_TEST_CONPTY: ${{ steps.prerequisites.outputs.conpty }}
        run: |
          set -euo pipefail
          read -ra mutate <<< "${MUTATE}"
          cargo mutants "${mutate[@]}" --shard "${SHARD}/${SHARDS}" --sharding round-robin \
            --no-shuffle --minimum-test-timeout 120 --jobs 2

      # A job stopped at its timeout ends cancelled, not failed, and its report matters as much.
      - name: Keep the report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.platform }}-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore

  # The one check the ruleset requires of this workflow, as ci.yml's passed job explains.
  passed:
    name: mutants passed
    if: always()
    # The plan too: had it failed, the runs would be skipped rather than failed.
    needs: [plan, mutants]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the plan and every system's run to have passed or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "${NEEDS}" > /dev/null
