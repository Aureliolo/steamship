name: Dependency review

# Refuses a pull request that brings in a dependency with a known advisory of any severity,
# checked against GitHub's advisory database, beside cargo-deny's RustSec one. Licences are
# cargo-deny's alone, from deny.toml.
on:
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the dependency graph of both sides of the pull request.

    steps:
      - name: Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          license-check: false
