name: winget

# winget-pkgs deprecates older manifest versions on its own schedule and then refuses submissions
# that use them, with nothing here changing. So each week the version the winget manifests are
# written in is held to the newest schema winget-cli publishes, and the winget the jobs install to
# its newest release. A pull request that changes either runs it too.
#
# Dispatched on a release's tag, it also submits that release to winget. Each submission is a pull
# request Microsoft's moderators review, so winget is offered the releases chosen, never each one.
on:
  schedule:
    - cron: '41 4 * * 3'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/packages.sh
      - .github/release-packages.sh
      - .github/actions/winget/action.yml
      - .github/workflows/winget.yml

permissions: {}

# A submission is never cancelled halfway, though a re-run of one would open nothing twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  schema:
    name: winget schema
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # Reads packages.sh and the pin; winget-cli is read from a public repository.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the manifest version with winget's newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ours="$(sed -n 's/^manifest_version=//p' .github/packages.sh)"
          newest="$(gh api repos/microsoft/winget-cli/contents/schemas/JSON/manifests --jq \
            '[.[].name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$")) | ltrimstr("v")]
             | sort_by(split(".") | map(tonumber)) | last')"
          if [[ -z "${ours}" || -z "${newest}" ]]; then
            echo "::error::Could not read the manifest version (${ours:-none}) or winget's newest (${newest:-none})."
            exit 1
          fi
          if [[ "${ours}" != "${newest}" ]]; then
            echo "::error file=.github/packages.sh::The winget manifests are written in ${ours}, and winget-cli's newest schema is ${newest}: set manifest_version to ${newest}, which winget-pkgs will otherwise come to refuse."
            exit 1
          fi
          echo "The winget manifests are written in ${newest}, winget-cli's newest schema."

      # The jobs that run winget install the client winget-pkgs validates with, so its pin is
      # held to winget-cli's newest release. The error gives the five lines to paste.
      - name: Compare the pinned winget with winget-cli's newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          action=.github/actions/winget/action.yml
          ours="$(sed -n 's/^ *WINGET_TAG: //p' "${action}")"
          release="$(gh api repos/microsoft/winget-cli/releases/latest)"
          newest="$(jq -r .tag_name <<< "${release}")"
          if [[ -z "${ours}" || -z "${newest}" ]]; then
            echo "::error::Could not read the pinned winget (${ours:-none}) or winget-cli's newest release (${newest:-none})."
            exit 1
          fi
          if [[ "${ours}" != "${newest}" ]]; then
            digest() { jq -r --arg name "$1" '.assets[] | select(.name == $name) | .digest | ltrimstr("sha256:")' <<< "${release}"; }
            license="$(jq -r '[.assets[].name | select(endswith("_License1.xml"))] | first // empty' <<< "${release}")"
            echo "::error file=${action}::winget ${ours} is pinned, and winget-cli's newest release is ${newest}. Set these in ${action}:"
            echo "WINGET_TAG: ${newest}"
            echo "WINGET_BUNDLE_SHA256: $(digest Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle)"
            echo "WINGET_DEPENDENCIES_SHA256: $(digest DesktopAppInstaller_Dependencies.zip)"
            echo "WINGET_LICENSE: ${license}"
            echo "WINGET_LICENSE_SHA256: $(digest "${license}")"
            exit 1
          fi
          echo "winget ${newest} is pinned, winget-cli's newest release."

  # The release's winget manifests, written as release.yml writes them, from its published and
  # attested checksums.
  write:
    name: winget (write)
    if: >-
      github.repository == 'Aureliolo/steamship' && github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
    needs: schema
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the tagged scripts and the published release.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version the tag names
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not a release tag. Run this workflow on one, such as v1.0.0."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Write them from the release's signed checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release-packages.sh "${GITHUB_REF_NAME}" packages

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget
          path: packages/winget/*.yaml
          if-no-files-found: error
          retention-days: 1

  # winget takes packages only through a pull request to microsoft/winget-pkgs, which
  # winget-submit.sh opens from the token's fork with a classic token; GitHub lets no fine-grained
  # token open one. wingetcreate is not used, since its newest release cannot read the schema
  # packages.sh writes.
  submit:
    name: winget (submit)
    needs: write
    runs-on: windows-2025
    timeout-minutes: 20
    # The token is a secret of this environment, which only release tags can deploy to.
    environment: winget
    permissions:
      contents: read # Reads the published release.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Refuse to go on without the token
        env:
          TOKEN_SET: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          if ($env:TOKEN_SET -ne 'true') {
            Write-Output '::error::The winget environment has no secret WINGET_TOKEN. See .github/release-process.md.'
            exit 1
          }

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install winget at its pinned release
        id: winget
        uses: ./.github/actions/winget # zizmor: ignore[self-repository]

      - name: Download the manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget
          path: packages/winget

      # The hashes come from the signed checksums already; each installer's archive is fetched
      # too, and checked to be signed, to hash to what its installer says and to hold the program
      # where its installer says.
      - name: Check each installer against the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.write.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $bundle = "steamship-$env:VERSION.intoto.jsonl"
          $manifest = Get-Content packages/winget/Aureliolo.steamship.installer.yaml -Raw
          $installers = [regex]::Matches($manifest,
            'InstallerUrl: (?<url>\S+)\s+InstallerSha256: (?<hash>\S+)\s+NestedInstallerFiles:\s+- RelativeFilePath: (?<path>\S+)')
          if ($installers.Count -ne 2) { throw "The installer manifest has $($installers.Count) installers, not 2." }
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir release --pattern $bundle
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($installer in $installers) {
            $url = $installer.Groups['url'].Value
            $archive = Split-Path -Leaf $url
            $release = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$archive"
            if ($url -cne $release) { throw "$url is not this release's $archive." }
            gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir release --pattern $archive
            gh attestation verify "release/$archive" --bundle "release/$bundle" `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-build.yml" `
              --source-ref $env:GITHUB_REF --deny-self-hosted-runners
            $hash = (Get-FileHash -Algorithm SHA256 "release/$archive").Hash
            if ($installer.Groups['hash'].Value -cne $hash) { throw "$archive hashes to $hash, not what its installer says." }
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "release/$archive").Path)
            $entries = $zip.Entries.FullName
            $zip.Dispose()
            $path = $installer.Groups['path'].Value
            if ($entries -cnotcontains ($path -replace '\\', '/')) { throw "$archive holds no $path." }
          }

      # The submission ticks winget-pkgs' validation box on the strength of this step.
      - name: Validate the manifests
        env:
          WINGET: ${{ steps.winget.outputs.winget }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:WINGET validate --manifest packages/winget

      - name: Submit them
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.write.outputs.version }}
        run: bash .github/winget-submit.sh "${VERSION}" packages/winget
