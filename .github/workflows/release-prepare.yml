name: Prepare release

# Cutting a tag by hand is the one release step nobody can check afterwards, and it is the step
# most often done at the wrong time, from the wrong branch, against the wrong version. This puts
# it behind a button: pick the bump, and out comes a branch with the signed version commit and a
# pull request for it, which merges itself once every required check has passed. The tagging and
# publishing follow, with nobody typing a version again.
#
# The pull request is opened as the packaging app rather than with the job token: GitHub holds the
# checks of anything a workflow opens with its own token until someone approves them, and a merge
# made with that token starts no workflow on main, so the tag would never come. Only the
# repository's owner may start it, since what it starts ends in a published release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: An exact version instead, such as 1.0.0. Overrides the bump above.
        required: false
        type: string

permissions: {}

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The app's key is a secret of this environment, which only main can deploy to.
    environment: release-prepare
    permissions:
      contents: read # Reads main, and whether a version's tag is taken; the app does the writing.

    steps:
      - name: Refuse anyone but the repository's owner
        env:
          STARTED_BY: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [[ "${STARTED_BY}" != "${GITHUB_REPOSITORY_OWNER}" ]]; then
            echo "::error::Only ${GITHUB_REPOSITORY_OWNER} prepares releases; this run was started by ${STARTED_BY}." >&2
            exit 1
          fi

      - name: Refuse to go on without the packaging app
        env:
          CLIENT_ID: ${{ vars.PACKAGING_APP_CLIENT_ID }}
          KEY_SET: ${{ secrets.PACKAGING_APP_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ -z "${CLIENT_ID}" || "${KEY_SET}" != true ]]; then
            echo "::error::The packaging app is not set up: the variable PACKAGING_APP_CLIENT_ID and the secret PACKAGING_APP_KEY in the release-prepare environment are needed. See .github/release-process.md." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      # The raise below runs offline, so that it can change nothing but the version; what it reads
      # has to be here first, exactly as the lock file names it.
      - name: Fetch the locked crates
        run: cargo fetch --locked

      - name: Raise the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "steamship") | .version')"
          IFS=. read -r major minor patch <<< "${current}"
          case "${BUMP}" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            *) next="${major}.${minor}.$((patch + 1))" ;;
          esac
          next="${VERSION:-${next}}"
          if [[ ! "${next}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "${next} is not a version of three numbers." >&2
            exit 1
          fi
          # The package's own version is the first `version` line in Cargo.toml.
          sed -i "0,/^version = \"${current}\"$/s//version = \"${next}\"/" Cargo.toml
          cargo update --workspace --offline
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          if [[ "${changed}" != "Cargo.lock Cargo.toml " ]]; then
            echo "The bump changed ${changed}rather than Cargo.toml and Cargo.lock." >&2
            exit 1
          fi
          {
            echo "version=${next}"
            echo "branch=release/v${next}"
          } >> "${GITHUB_OUTPUT}"

      # A tag rather than a release: a version can be tagged with no release attached, and the tag
      # ruleset lets nothing move or delete one, so that number is spent either way. Matching refs
      # answer an empty list when there is none, so a failed request fails rather than reads free.
      - name: Refuse a version whose tag is taken
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          taken="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}" \
            --jq "map(select(.ref == \"refs/tags/v${VERSION}\")) | length")"
          if [[ "${taken}" != 0 ]]; then
            echo "v${VERSION} is already tagged. Pick a version whose tag is free." >&2
            exit 1
          fi

      - name: Act as the packaging app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PACKAGING_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGING_APP_KEY }}
          repositories: steamship
          permission-contents: write
          permission-pull-requests: write

      # Committed through the API rather than pushed: GitHub signs what it commits itself, and the
      # branch ruleset on main takes only signed commits.
      - name: Commit the bump on a branch of its own
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" > /dev/null 2>&1; then
            # Left by a run that stopped part way: this run starts it again from main.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f "sha=${GITHUB_SHA}" -F force=true > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/heads/${BRANCH}" -f "sha=${GITHUB_SHA}" > /dev/null
          fi
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg head "${GITHUB_SHA}" \
            --arg headline "Release v${VERSION}" \
            --arg manifest "$(base64 -w0 Cargo.toml)" \
            --arg lock "$(base64 -w0 Cargo.lock)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $headline},
                fileChanges: {additions: [
                  {path: "Cargo.toml", contents: $manifest},
                  {path: "Cargo.lock", contents: $lock}
                ]}
              }}
            }' > commit.json
          gh api graphql --input commit.json --jq .data.createCommitOnBranch.commit.oid
          rm commit.json

      # Auto-merge waits for every check the ruleset on main requires, and merges only when all
      # have passed; one that fails leaves the pull request open, and nothing is released.
      - name: Open the release pull request, to merge itself once its checks pass
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          # One already open for the branch, from an earlier run, carries the new commit as it is.
          url="$(gh pr list --head "${BRANCH}" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "${url}" ]]; then
            url="$(gh pr create --base main --head "${BRANCH}" --title "Release v${VERSION}" \
              --body "Raises the version to ${VERSION}. This merges itself once every required check has passed, which tags v${VERSION} and builds, signs and publishes the release.")"
          fi
          gh pr merge "${url}" --auto --squash
          {
            echo "## Release v${VERSION}"
            echo
            echo "${url}"
            echo
            echo 'It merges itself once every required check has passed: that tags and publishes.'
          } >> "${GITHUB_STEP_SUMMARY}"
