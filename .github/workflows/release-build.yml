name: Release build

# Everything that makes a release's bytes, and the signature over them, in one reusable
# workflow. That is what SLSA Build Level 3 asks of GitHub Actions: the certificate Sigstore
# issues names this file as the builder, so a verifier that insists on it (`--signer-workflow`)
# is insisting on these build steps, which no caller can change. release.yml only decides when
# a release happens and publishes what comes out.
#
# The build and the signing are separate jobs. A job granted `id-token: write` exposes the token
# to every step it runs, and building runs the build scripts of every crate; only the attest job,
# which downloads the bytes and signs them, can ever mint one.
on:
  workflow_call:
    outputs:
      version:
        description: The version the tag names, checked against Cargo.toml
        value: ${{ jobs.verify.outputs.version }}

permissions: {}

jobs:
  verify:
    name: verify
    if: github.repository == 'Aureliolo/steamship'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the tagged source, and main to check the tag is on it.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" main:refs/remotes/origin/main
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "Release commit ${release_commit} is not reachable from origin/main." >&2
            exit 1
          fi

      # The branch ruleset requires signed commits on main, so this only fails if that ruleset
      # was bypassed or removed. That is exactly when you want to hear about it.
      - name: Verify the release commit is signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verification="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.verification')"
          if [[ "$(jq -r .verified <<<"${verification}")" != "true" ]]; then
            echo "Release commit ${GITHUB_SHA} carries no valid signature: $(jq -r .reason <<<"${verification}")" >&2
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install

      - name: Verify the tag names the crate's version
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "steamship") | .version')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not name the crate's version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  # Each binary is built on the system it is for, from the same tagged commit. No cache here on
  # purpose: a cache entry can be written by any job on any branch, including a pull request
  # from a fork, and a release build is the last place to accept bytes whose provenance is a
  # cache key.
  build:
    name: build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linked statically against musl, so the binary runs on any x86-64 Linux whatever its
          # glibc, and the runner it is built on sets no floor.
          - target: x86_64-unknown-linux-musl
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-26.04
            native: true
          - target: x86_64-pc-windows-msvc
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
            native: true
          - target: aarch64-apple-darwin
            # renovate: datasource=github-runners depName=macos
            runner: macos-26
            native: true
          - target: x86_64-apple-darwin
            # renovate: datasource=github-runners depName=macos
            runner: macos-26
            native: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # Reads the tagged source it builds.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${TARGET}"

      # musl's C compiler wrapper, for the C and assembly in ring, from the image's own signed
      # Ubuntu archive.
      - name: Install musl-gcc
        if: endsWith(matrix.target, '-musl')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      # From source at an exact version, every dependency held to the hashes in its lock file.
      - name: Install cargo-auditable
        env:
          # renovate: datasource=crate depName=cargo-auditable
          CARGO_AUDITABLE_VERSION: 0.7.6
        run: cargo install cargo-auditable --version "${CARGO_AUDITABLE_VERSION}" --locked

      - name: Install the test prerequisites
        if: matrix.native
        uses: ./.github/actions/test-prerequisites # zizmor: ignore[self-repository]

      # The tests again, on the tagged commit and the system each binary is for, where that
      # system can run them.
      - name: Test
        if: matrix.native
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --target "${TARGET}"

      # The dist profile, optimised as a whole program, where `cargo install` keeps to the
      # quicker release profile. Windows' flags come from .cargo/config.toml, which the tests
      # above were built with too.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo auditable build --locked --profile dist --target "${TARGET}"

      - name: Verify the build left the source as it was
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "The tests or the build changed the checked-out release source." >&2
            git status --short >&2
            exit 1
          fi

      - name: Pack the binary with its licences, README, man pages and completions
        id: pack
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Named for the target without Rust's placeholder vendor, which says nothing to someone
          # choosing a download: x86_64-linux-musl, not x86_64-unknown-linux-musl.
          name="steamship-${VERSION}-${TARGET/-unknown-/-}"
          binary="steamship"
          if [[ "${TARGET}" == *windows* ]]; then
            binary="steamship.exe"
          fi
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/dist/${binary}" README.md LICENSE-APACHE LICENSE-MIT "dist/${name}/"
          # A man page per command and tab completion per shell, from the same definitions as
          # `--help`, made by the docs generator so the program itself carries no man writer.
          cargo run --locked --quiet -p steamship-docs-site -- package "dist/${name}"
          cd dist
          if [[ "${TARGET}" == *windows* ]]; then
            archive="${name}.zip"
            7z a -tzip -bso0 "${archive}" "${name}"
          else
            archive="${name}.tar.gz"
            tar -czf "${archive}" "${name}"
          fi
          rm -rf "${name}"
          if command -v sha256sum > /dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ steps.pack.outputs.archive }}
            dist/${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  # One SBOM for the release, read from the four binaries themselves. Then the job checks the
  # SBOM says what it should, because an SBOM that lists nothing looks exactly like a passing step.
  sbom:
    name: sbom
    needs: [verify, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # Reads the lock file at the tag, to know what each binary should list.

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify the archives, and lay out what syft reads
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          platforms=(x86_64-linux-musl x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin)
          expected="$(for platform in "${platforms[@]}"; do
            extension=tar.gz
            [[ "${platform}" == *windows* ]] && extension=zip
            printf 'dist/steamship-%s-%s.%s\n' "${VERSION}" "${platform}" "${extension}"
            printf 'dist/steamship-%s-%s.%s.sha256\n' "${VERSION}" "${platform}" "${extension}"
          done | sort)"
          actual="$(find dist -maxdepth 1 -type f -print | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "The build left other files than the four archives and their checksums:" >&2
            printf '%s\n' "${actual}" >&2
            exit 1
          fi
          (cd dist && sha256sum --check ./*.sha256)
          mkdir sbom-input
          for archive in dist/*.tar.gz; do tar -xzf "${archive}" -C sbom-input; done
          for archive in dist/*.zip; do unzip -q "${archive}" -d sbom-input; done

      # Scoop installs from this file by the release's address, so it ships in the release and is
      # signed with it, written from the checksums just checked.
      - name: Write the Scoop manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          .github/packages.sh "${VERSION}" dist "${RUNNER_TEMP}/packages"
          cp "${RUNNER_TEMP}/packages/bucket/steamship.json" dist/steamship.json

      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_SOURCE_NAME: steamship
          SYFT_SOURCE_VERSION: ${{ needs.verify.outputs.version }}
        with:
          path: sbom-input
          config: .github/syft.yaml
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.52.0
          format: spdx-json
          output-file: dist/steamship-${{ needs.verify.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Rust
        run: rustup toolchain install

      # Every crate linked into each binary, as the lock file resolves it for that target, listed
      # at its exact version; and every file shipped, with a SHA-256. Procedural macros run while
      # compiling and are not in the binary, so they are not asked for.
      - name: Check the SBOM lists what ships
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          sbom="dist/steamship-${VERSION}.spdx.json"
          failed=0
          for target in x86_64-unknown-linux-musl x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            cargo tree --locked --edges normal,no-proc-macro --target "${target}" --prefix none --no-dedupe \
              | sed -E 's/ \(.*\)$//; s/ v/ /' | sort -u
          done | sort -u > crates.txt
          test -s crates.txt
          while read -r name version; do
            if ! jq -e --arg n "${name}" --arg v "${version}" \
                'any(.packages[]; .name == $n and .versionInfo == $v)' "${sbom}" > /dev/null; then
              echo "The SBOM does not list ${name} ${version}." >&2
              failed=1
            fi
          done < crates.txt
          (cd sbom-input && find . -type f | sed 's|^\./|/|' | sort) > shipped.txt
          jq -r '(.files // [])[] | select(any(.checksums[]; .algorithm == "SHA256")) | .fileName' "${sbom}" \
            | sed 's|^\./|/|; s|^\([^/]\)|/\1|' | sort > listed.txt
          if ! diff -u shipped.txt listed.txt; then
            echo "The SBOM's files are not the files the archives ship." >&2
            failed=1
          fi
          rm -f crates.txt shipped.txt listed.txt
          exit "${failed}"

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            dist/steamship-${{ needs.verify.outputs.version }}-*
            dist/steamship-${{ needs.verify.outputs.version }}.spdx.json
            dist/steamship.json
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest
    needs: [verify, sbom]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      id-token: write # Sigstore signs against this token.
      attestations: write # Writes the provenance onto the repository.

    steps:
      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/steamship-*
            dist/steamship.json

      - name: Attest the SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/steamship-*.tar.gz
            dist/steamship-*.zip
          sbom-path: dist/steamship-${{ needs.verify.outputs.version }}.spdx.json

      # The attestations are stored on the repository too, but only a verifier with GitHub's API
      # reaches them there. A copy beside the archives verifies from the file alone
      # (`gh attestation verify --bundle`), and it is the only form OpenSSF Scorecard counts as a
      # signed release.
      - name: Gather the signed attestations into one file
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p attestations
          bundle="attestations/steamship-${VERSION}.intoto.jsonl"
          cat "${PROVENANCE}" "${SBOM}" > "${bundle}"
          lines=$(wc -l < "${bundle}")
          if [ "${lines}" -ne 2 ]; then
            echo "Expected one provenance and one SBOM attestation, found ${lines} lines." >&2
            exit 1
          fi

      - name: Upload the signed attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestations
          path: attestations/steamship-${{ needs.verify.outputs.version }}.intoto.jsonl
          if-no-files-found: error
          retention-days: 1
