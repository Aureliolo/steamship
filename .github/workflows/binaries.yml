name: Binaries

# Microsoft's BinSkim over the programs as the release builds them, on the systems they are for:
# the exploit mitigations and build hygiene its rules check, with every result in the Security
# tab. tests/hardening.rs asserts the mitigations steamship relies on; this is the wider,
# independent look. No paths filter: a required check a filter skipped never reports.
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The NuGet package, which Microsoft signs, refused unless it matches the digest written here.
  # renovate: datasource=nuget depName=Microsoft.CodeAnalysis.BinSkim
  BINSKIM_VERSION: 4.4.9.11
  BINSKIM_SHA256: 69678989cbc273b5b50fcf98fb0fd978e1e35a3f844acb24254b31f0ce90c447

jobs:
  binskim:
    name: binskim (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            program: steamship.exe
            binskim: win-x64/BinSkim.exe
            # Several PE rules read the program database, so line tables are kept for it.
            debug: line-tables-only
            # BA2014, functions without /GS stack cookies: the static C runtime makes BinSkim read
            # the program as C++, and Rust has no /GS; the rule then lists Rust's own functions.
            # The C runtime's objects are built with /GS, which BinSkim's other rules confirm.
            accepted: BA2014
          - platform: linux
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            program: steamship
            binskim: linux-x64/BinSkim
            # Stripped, as the release ships it.
            debug: none
            # BA3003, stack canaries: Rust's -Z stack-protector is unstable, and safe Rust does not
            # write past a buffer's end. Stack clash protection, which Rust does have, is BA3005.
            accepted: BA3003
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # Reads the source it builds.
      security-events: write # Uploads the results to code scanning.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${TARGET}"

      - name: Install musl-gcc
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      # The release profile rather than the release's own whole-program build: the same flags
      # and mitigations in a third of the time.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PROFILE_RELEASE_DEBUG: ${{ matrix.debug }}
        run: cargo build --locked --release --target "${TARGET}"

      - name: Install BinSkim
        run: |
          set -euo pipefail
          package="${RUNNER_TEMP}/binskim.nupkg"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${package}" \
            "https://api.nuget.org/v3-flatcontainer/microsoft.codeanalysis.binskim/${BINSKIM_VERSION}/microsoft.codeanalysis.binskim.${BINSKIM_VERSION}.nupkg"
          echo "${BINSKIM_SHA256}  ${package}" | sha256sum --check --strict
          # Unpacked whole, since Git for Windows' unzip will not let a wildcard cross a folder,
          # and beside the checkout by a relative path, since the runner's own folders there start
          # with a drive letter, which bash cannot glob.
          unzip -q "${package}" -d .binskim
          # A zip carries no executable bit, which only Linux asks for.
          if [[ "${RUNNER_OS}" == Linux ]]; then
            chmod +x .binskim/tools/*/linux-x64/BinSkim
          fi

      # Findings are judged from the results below rather than BinSkim's exit code, which does
      # not tell a finding from the tool failing. Messages are written out in full, which code
      # scanning requires, and each accepted rule is dropped with its reason given above.
      - name: Analyse
        env:
          TARGET: ${{ matrix.target }}
          PROGRAM: ${{ matrix.program }}
          BINSKIM: ${{ matrix.binskim }}
          ACCEPTED: ${{ matrix.accepted }}
        run: |
          set -euo pipefail
          binskim="$(echo .binskim/tools/net*/"${BINSKIM}")"
          status=0
          "${binskim}" analyze "target/${TARGET}/release/${PROGRAM}" --output raw.sarif \
            --insert FlattenedMessages --quiet || status=$?
          echo "BinSkim exited with ${status}."
          jq -e 'all(.runs[].invocations[]; .executionSuccessful)' raw.sarif > /dev/null
          # A result BinSkim left as a reference to its rule's wording gets that wording, with its
          # arguments put in, since code scanning takes only text.
          jq --arg accepted "${ACCEPTED}" \
            '($accepted | split(" ")) as $accepted
             | .runs[] |= (
                 ([.tool.driver.rules[]? | {key: .id, value: .messageStrings}] | from_entries) as $wording
                 | .results |= map(
                     select(.ruleId as $rule | $accepted | index($rule) | not)
                     | if .message.text then . else
                         (.message.arguments // []) as $arguments
                         | .message.text = (
                             reduce range($arguments | length) as $i
                               ($wording[.ruleId][.message.id].text // .message.id // .ruleId;
                                gsub("[{]\($i)[}]"; $arguments[$i]))
                           )
                       end
                   )
               )' \
            raw.sarif > binskim.sarif
          jq -e 'all(.runs[].results[]; .message.text | type == "string")' binskim.sarif > /dev/null

      - name: Upload the results
        if: '!cancelled()'
        uses: github/codeql-action/upload-sarif@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          sarif_file: binskim.sarif
          category: binskim-${{ matrix.platform }}

      - name: Refuse any error BinSkim found
        run: |
          set -euo pipefail
          found='[.runs[].results[] | select((.level // "warning") == "error" and (.kind // "fail") == "fail")]'
          jq -r "${found}[] | \"\(.ruleId): \(.message.text)\"" binskim.sarif
          # Decided by jq's own exit status: its text ends in a carriage return on Windows.
          jq -e "${found} | length == 0" binskim.sarif > /dev/null
