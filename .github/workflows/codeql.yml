name: CodeQL

on:
  push:
    branches:
      - main
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:
  schedule:
    - cron: '23 5 * * 3'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: codeql (${{ matrix.language }})
    # A release's Homebrew and Scoop pull request, opened by the packaging app on a branch of this
    # repository, changes no code to analyse. The passed job below counts a skipped one as passed.
    if: >-
      ${{ !(github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'packages/v')
      && github.event.pull_request.user.login == 'aurelios-git-bot[bot]') }}
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      security-events: write # Uploads the findings to code scanning.
      contents: read # Reads the source it analyses.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          category: /language:${{ matrix.language }}

  # The one check the ruleset requires of this workflow, as ci.yml's passed job explains.
  passed:
    name: codeql passed
    if: always()
    needs: [analyse]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every language's analysis to have passed or been skipped
        env:
          RESULT: ${{ needs.analyse.result }}
        run: |
          echo "codeql: ${RESULT}"
          [[ "${RESULT}" == success || "${RESULT}" == skipped ]]
