name: CI

on:
  push:
    branches:
      - main
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Named by platform rather than by runner image: the name is what the branch ruleset requires,
  # and an image raise must not rename a required check out from under it.
  rust:
    name: rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Renovate reads a runner out of `runs-on:` but not out of a matrix, so each of these
        # carries its own line for it; the Windows Arm runner has no image Renovate tracks. There
        # is no Arm Linux entry: Valve's steamcmd for Linux is an x86 program, so steamship on Arm
        # Linux could not upload.
        include:
          - platform: linux
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-26.04
            musl: x86_64-unknown-linux-musl
          - platform: windows
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
            spectre: spectre
          - platform: windows-arm
            runner: windows-11-arm
            spectre: spectre
          - platform: macos
            # renovate: datasource=github-runners depName=macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # Reads the source it builds.
    env:
      # The release's C runtime, with Spectre mitigations, so that a runner without it fails
      # here rather than at a release; see .cargo/config.toml.
      VSCMD_ARG_VCVARS_SPECTRE: ${{ matrix.spectre }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain rust-toolchain.toml pins, fetched by the runner's rustup, which checks every
      # component against the hashes in Rust's release manifest.
      - name: Install Rust
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      # The fuzz harness too, so the targets are held to the same lints as the crate.
      - name: Lint
        if: '!cancelled()'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Install the test prerequisites
        uses: ./.github/actions/test-prerequisites # zizmor: ignore[self-repository]

      - name: Test
        if: '!cancelled()'
        run: cargo test --locked

      # The Linux release binary is the static musl build, so it is tested as such on every change
      # rather than first at a release. musl-gcc, for the C and assembly in ring, comes from the
      # image's own signed Ubuntu archive.
      - name: Test the static Linux build
        if: matrix.musl && !cancelled()
        env:
          MUSL: ${{ matrix.musl }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add "${MUSL}"
          cargo test --locked --target "${MUSL}"

      # The crate as crates.io would receive it, built from its package alone: a file the build
      # reads but the package leaves out fails here rather than at publishing.
      - name: Build the published package
        if: '!cancelled()'
        run: cargo publish --dry-run --locked

  # A floor on the lines the tests run, measured on Linux, where the Unix-only checks run too. A
  # change that adds code without tests for it fails here.
  coverage:
    name: coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # Reads the source it measures.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Install cargo-llvm-cov
        env:
          # renovate: datasource=github-release-attachments depName=taiki-e/cargo-llvm-cov versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          CARGO_LLVM_COV_TAG: v0.9.1
          CARGO_LLVM_COV_SHA256: 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${archive}" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/${CARGO_LLVM_COV_TAG}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_LLVM_COV_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Install the test prerequisites
        uses: ./.github/actions/test-prerequisites # zizmor: ignore[self-repository]

      - name: Measure
        run: cargo llvm-cov --locked --fail-under-lines 97

  # Spelling in British English everywhere, the code included.
  typos:
    name: typos
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the files it checks.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  # No em dash anywhere, and no en dash standing in for one.
  dashes:
    name: dashes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the files it checks.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for dashes
        # The dashes are built from their UTF-8 bytes, so this file holds none for the search to
        # find and the pattern does not depend on the runner's locale.
        run: |
          set -euo pipefail
          em="$(printf '\342\200\224')"
          en="$(printf '\342\200\223')"
          if git grep -n -I -F -e "${em}" -e "${en}"; then
            echo "::error::Em and en dashes are not used here; use a colon, semicolon, comma, full stop or brackets."
            exit 1
          fi

  # The .deb and the .rpm, from a Linux archive packed as the release packs it, linted and then
  # installed and used on bare Debian and Fedora, so a change that breaks them fails here rather
  # than at a release.
  linux-packages:
    name: linux packages
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # Reads the source it builds.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # musl-gcc, for the C and assembly in ring, from the image's own signed Ubuntu archive.
      - name: Install Rust and musl-gcc
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      # The release profile rather than the release's dist one, which only adds whole-program
      # optimisation and would triple the build.
      - name: Build and pack the Linux binary
        id: pack
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "steamship") | .version')"
          cargo build --locked --release --target x86_64-unknown-linux-musl
          archive="$(.github/pack.sh "${version}" x86_64-unknown-linux-musl release)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=dist/${archive}" >> "${GITHUB_OUTPUT}"

      - name: Build, lint and install the packages
        uses: ./.github/actions/linux-packages # zizmor: ignore[self-repository]
        with:
          version: ${{ steps.pack.outputs.version }}
          archive: ${{ steps.pack.outputs.archive }}
          out: packages

      # The AUR package too, written by packages.sh as a release writes it, for this archive. The
      # other systems' archives are not built here, so their checksums are stand-ins.
      - name: Write the AUR package for this archive
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          set -euo pipefail
          for other in aarch64-apple-darwin.tar.gz x86_64-apple-darwin.tar.gz \
              x86_64-pc-windows-msvc.zip aarch64-pc-windows-msvc.zip; do
            name="steamship-${VERSION}-${other}"
            printf '%064d *%s\n' 0 "${name}" > "dist/${name}.sha256"
          done
          .github/packages.sh "${VERSION}" dist written
          cp "${ARCHIVE}" written/aur/

      - name: Build, lint and install the AUR package
        uses: ./.github/actions/aur # zizmor: ignore[self-repository]
        with:
          folder: written/aur

  # The pinned steamcmd, installed for real from Valve's CDN on each system, then installed again,
  # which must find it as pinned. Nothing runs steamcmd here.
  install:
    name: install (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-26.04
          - platform: windows
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
          # Valve's x86 steamcmd, emulated by Windows on Arm, driven by steamship built for Arm.
          - platform: windows-arm
            runner: windows-11-arm
          - platform: macos
            # renovate: datasource=github-runners depName=macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # Reads the source it builds.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Install steamcmd, then verify it
        run: |
          set -euo pipefail
          export STEAMSHIP_HOME="${RUNNER_TEMP}/steamship home"
          cargo run --locked -- install | tee "${RUNNER_TEMP}/first.txt"
          grep -q ', installed as pinned$' "${RUNNER_TEMP}/first.txt"
          cargo run --locked -- install | tee "${RUNNER_TEMP}/second.txt"
          grep -q ', pinned and verified$' "${RUNNER_TEMP}/second.txt"

      # The whole of an upload but the login, against Valve's own test app: steamcmd run out of
      # sight on this system, given the copy of the script, and refused by Steam, since an
      # anonymous account may not build. Had steamcmd updated itself, the check after the run
      # would exit 4 rather than 1.
      - name: Upload a preview anonymously, which Steam refuses
        run: |
          set -euo pipefail
          export STEAMSHIP_HOME="${RUNNER_TEMP}/steamship home"
          status=0
          cargo run --locked -- upload tests/fixtures/spacewar/steam/app_build.vdf \
            --version ci --account anonymous --preview 2> "${RUNNER_TEMP}/upload.txt" || status=$?
          cat "${RUNNER_TEMP}/upload.txt"
          test "${status}" -eq 1
          grep -q '^  ✗ Failed to initialize build on server (Access Denied)$' "${RUNNER_TEMP}/upload.txt"

      # steamcmd keeps its login in a config.vdf whose place differs by system. This is where each
      # system shows the one it uses, which must be the one steamship reads to redact and to pack
      # for CI, and writes a login handed over back to. And nothing of steamcmd's may land in the
      # runner's own home, which would be the user's.
      - name: Find steamcmd's login file where steamship looks, and nowhere else
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          home="${RUNNER_TEMP}/steamship home"
          found="$(cd "${home}" && find . -path '*/config/config.vdf' | sed 's|^\./||')"
          echo "config.vdf: ${found:-none}"
          case "${PLATFORM}" in
            windows*) expected=steamcmd/config/config.vdf ;;
            linux) expected=Steam/config/config.vdf ;;
            macos) expected="Library/Application Support/Steam/config/config.vdf" ;;
          esac
          if [[ "${found}" != "${expected}" ]]; then
            echo "steamcmd kept its login in ${found:-no file}, where steamship looks in ${expected}." >&2
            exit 1
          fi
          for leaked in "${HOME}/Steam" "${HOME}/.steam" "${HOME}/Library/Application Support/Steam"; do
            if [[ -e "${leaked}" ]]; then
              echo "steamcmd wrote to ${leaked}, outside the steamship home." >&2
              exit 1
            fi
          done

      # Steam's partner Web API, asked with a key of the right form that no publisher holds: it
      # refuses the key, which `builds` says, exiting 1. The key travels in a header, so this is
      # also where Steam shows it reads one there.
      - name: Have the partner Web API refuse a key that is not one
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          status=0
          STEAMSHIP_WEB_API_KEY=00000000000000000000000000000000 \
            cargo run --locked -- builds 480 2> "${RUNNER_TEMP}/builds.txt" || status=$?
          cat "${RUNNER_TEMP}/builds.txt"
          test "${status}" -eq 1
          grep -q '^  ✗ Steam refused the Web API key; ' "${RUNNER_TEMP}/builds.txt"

      - name: Install D-Bus and GNOME Keyring
        if: matrix.platform == 'linux'
        uses: ./.github/actions/test-prerequisites # zizmor: ignore[self-repository]

      # A key kept as a Linux desktop keeps one: libsecret's own secret-tool stores it in GNOME
      # Keyring, steamship finds it for its home and has Steam refuse it as above, then `logout`
      # forgets it, which secret-tool must see too. The bus and the keyring are this step's own.
      - name: Use a key GNOME Keyring keeps, then forget it
        if: matrix.platform == 'linux'
        run: |
          dbus-run-session -- bash <<'SESSION'
          set -euo pipefail
          printf 'ci' | gnome-keyring-daemon --unlock --components=secrets --daemonize > /dev/null
          # A home of its own: `logout` here must not take the anonymous login the next step packs.
          export STEAMSHIP_HOME="${RUNNER_TEMP}/key home"
          printf '00000000000000000000000000000000' | secret-tool store \
            --label='steamship Web API key' \
            application steamship kind web-api-key home "${STEAMSHIP_HOME}"
          status=0
          cargo run --locked -- builds 480 > "${RUNNER_TEMP}/kept.txt" 2>&1 || status=$?
          cat "${RUNNER_TEMP}/kept.txt"
          test "${status}" -eq 1
          grep -q '^  api key   kept in the Secret Service$' "${RUNNER_TEMP}/kept.txt"
          grep -q '^  ✗ Steam refused the Web API key; ' "${RUNNER_TEMP}/kept.txt"
          cargo run --locked -- logout | tee "${RUNNER_TEMP}/logout.txt"
          grep -q '^  api key   ✓ forgotten$' "${RUNNER_TEMP}/logout.txt"
          if secret-tool lookup application steamship kind web-api-key home "${STEAMSHIP_HOME}"; then
            echo "logout left the key in GNOME Keyring." >&2
            exit 1
          fi
          SESSION

      # The login the anonymous run saved, packed by `steamship ci` as for a CI secret, then handed
      # to an upload in a home of its own through STEAMSHIP_LOGIN alone: the account comes from
      # it, and steamcmd, given it back where it reads it, gets as far as Steam's refusal again.
      - name: Pack the login for CI, then upload with nothing but it
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          script=tests/fixtures/spacewar/steam/app_build.vdf
          login="${RUNNER_TEMP}/login.txt"
          STEAMSHIP_HOME="${RUNNER_TEMP}/steamship home" \
            cargo run --locked -- ci --script "${script}" --account anonymous --output "${login}"
          export STEAMSHIP_HOME="${RUNNER_TEMP}/ci home"
          status=0
          STEAMSHIP_LOGIN="$(cat "${login}")" cargo run --locked -- upload "${script}" \
            --version ci --preview > "${RUNNER_TEMP}/ci.txt" 2>&1 || status=$?
          rm -f "${login}"
          cat "${RUNNER_TEMP}/ci.txt"
          test "${status}" -eq 1
          grep -q '^  ✗ Failed to initialize build on server (Access Denied)$' "${RUNNER_TEMP}/ci.txt"
          case "${PLATFORM}" in
            windows*) restored=steamcmd/config/config.vdf ;;
            linux) restored=Steam/config/config.vdf ;;
            macos) restored="Library/Application Support/Steam/config/config.vdf" ;;
          esac
          test -s "${STEAMSHIP_HOME}/${restored}"

  # Each pin against the manifest Valve serves now. At the same version they must be the same bytes:
  # a Renovate raise moves only the version, and pins.yml finishes it on Renovate's branch, so a
  # pin that still differs is one that was not finished. When Valve is ahead, Renovate raises the
  # pin, so that is a notice rather than a failure.
  pins:
    name: pins
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the pins it compares.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the pins with Valve's manifests
        run: |
          set -euo pipefail
          version() { grep -m1 -oE '"version"[[:space:]]+"[0-9]+"' "$1" | grep -oE '[0-9]+'; }
          failed=0
          for system in win64 linux osx; do
            pinned="pins/steam_cmd_${system}.vdf"
            live="${RUNNER_TEMP}/steam_cmd_${system}"
            curl -fsS --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${live}" \
              "https://cdn.steamstatic.com/client/steam_cmd_${system}"
            if [ "$(version "${pinned}")" != "$(version "${live}")" ]; then
              echo "::notice file=${pinned}::Valve serves steamcmd $(version "${live}") for ${system}; the pin is $(version "${pinned}"), and Renovate raises it."
            elif ! cmp -s "${pinned}" "${live}"; then
              echo "::error file=${pinned}::${pinned} names Valve's current version but not its packages. Run 'cargo run --example pins' and commit what it writes."
              failed=1
            fi
          done
          exit "${failed}"

  # A dependency the code no longer uses is attack surface for nothing.
  machete:
    name: machete
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the manifests it checks.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-machete
        env:
          # renovate: datasource=github-release-attachments depName=bnjbvr/cargo-machete versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          CARGO_MACHETE_TAG: v0.9.2
          CARGO_MACHETE_SHA256: 48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9
        run: |
          set -euo pipefail
          name="cargo-machete-${CARGO_MACHETE_TAG}-x86_64-unknown-linux-musl"
          archive="${RUNNER_TEMP}/${name}.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${archive}" \
            "https://github.com/bnjbvr/cargo-machete/releases/download/${CARGO_MACHETE_TAG}/${name}.tar.gz"
          echo "${CARGO_MACHETE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}" >> "${GITHUB_PATH}"

      - name: Check for unused dependencies
        run: cargo machete

  # The parsers read files and output steamship did not write, so each gets a minute of libFuzzer
  # per run.
  # Linux only: on Windows the coverage instrumentation links only against the AddressSanitizer
  # runtime, and a sanitiser adds nothing here, where no fuzzed code is unsafe.
  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [vdf, elf, macho, pattern, redact, terminal, dbus, picture]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # Reads the source it builds.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      # From source at an exact version, every dependency held to the hashes in its lock file.
      - name: Install cargo-fuzz
        env:
          # renovate: datasource=crate depName=cargo-fuzz
          CARGO_FUZZ_VERSION: 0.13.2
        run: cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          corpus="${GITHUB_WORKSPACE}/fuzz/corpus/${TARGET}"
          seeds="${GITHUB_WORKSPACE}/fuzz/seeds/${TARGET}"
          mkdir -p "${corpus}" "${seeds}"
          cargo fuzz run --sanitizer none "${TARGET}" "${corpus}" "${seeds}" -- -max_total_time=60

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Licences, advisories, duplicate crates and where every crate comes from.
  deny:
    name: deny
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the lock file it checks.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      # The release archive, refused unless it matches the digest written here.
      - name: Install cargo-deny
        env:
          # renovate: datasource=github-release-attachments depName=EmbarkStudios/cargo-deny versioning=semver
          CARGO_DENY_TAG: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_TAG}-x86_64-unknown-linux-musl"
          archive="${RUNNER_TEMP}/${name}.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_TAG}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}" >> "${GITHUB_PATH}"

      # The whole workspace: without --workspace only the default member would be checked.
      - name: Check
        run: cargo deny --workspace --locked check --deny warnings

  markdown:
    name: markdown
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the Markdown it lints.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
