name: Release

# The tag is created by the tag workflow with the job token, and an event caused by that token
# starts no workflow, so a push trigger alone would never fire; the tag workflow dispatches this
# one on the tag instead. The push trigger stays for a tag pushed by hand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

# Keyed on the tag rather than the workflow, and never cancelled: two tags are two releases and
# must both run, while the same tag twice is a re-run that should not race itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Building, testing, the SBOM and the signing all happen in release-build.yml, so the identity
  # Sigstore certifies is those build steps rather than this file's; see there.
  build:
    name: build
    if: github.repository == 'Aureliolo/steamship'
    permissions:
      contents: read # The build reads the tagged source.
      id-token: write # Only release-build.yml's attest job uses it, to sign.
      attestations: write # Only release-build.yml's attest job uses it, to store the provenance.
    # zizmor wants `$/...` here, which actionlint rejects as neither of the forms GitHub
    # documents; this path only runs on a tag, where a syntax error is a failed release.
    uses: ./.github/workflows/release-build.yml # zizmor: ignore[self-repository]

  publish:
    name: publish
    if: github.repository == 'Aureliolo/steamship'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write # Creates the release and uploads the assets onto it.

    steps:
      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist

      - name: Download the signed attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestations
          path: dist

      # The bytes have moved between jobs twice by now, and they are the bytes the attestation was
      # made over, so the last thing before publishing is to check they still hash right.
      - name: Verify the checksums once more
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check ./*.sha256)

      # Every file that ships has to verify the way a user will check it, from the file alone,
      # and has to name release-build.yml at this tag as the builder; otherwise it only looks like
      # proof.
      - name: Verify the attestations that will ship
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          bundle="dist/steamship-${VERSION}.intoto.jsonl"
          signer="${GITHUB_REPOSITORY}/.github/workflows/release-build.yml"
          verify() {
            gh attestation verify "$@" --bundle "${bundle}" \
              --repo "${GITHUB_REPOSITORY}" --signer-workflow "${signer}" \
              --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
          }
          for subject in dist/steamship-* dist/steamship.json; do
            if [[ "${subject}" != "${bundle}" ]]; then
              verify "${subject}"
            fi
          done
          for archive in dist/*.tar.gz dist/*.zip; do
            verify "${archive}" --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)

          # A draft is a release `gh release create` began and did not finish. A draft was never
          # public, so it is removed and the release made again.
          drop_unfinished_draft() {
            if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2> /dev/null)" = "true" ]; then
              echo "${GITHUB_REF_NAME} has a draft left by an unfinished create; removing it."
              gh release delete "${GITHUB_REF_NAME}" --yes
            fi
          }

          # A release the tag already carries is taken as done, so the whole run can be re-run
          # after a later job fails. A published release is immutable, so the way to be
          # idempotent about it is to confirm it is already right, which means these files and no
          # others; anything else needs a person.
          already_released() {
            if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
              return 1
            fi
            have="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)"
            want="$(printf '%s\n' "${assets[@]##*/}" | sort)"
            if [ "${have}" = "${want}" ]; then
              echo "${GITHUB_REF_NAME} is released with all its files."
              return 0
            fi
            echo "${GITHUB_REF_NAME} already has a release, and it carries:" >&2
            printf '%s\n' "${have}" >&2
            echo "rather than the files this job publishes. It is not rewritten here." >&2
            exit 1
          }

          drop_unfinished_draft
          if already_released; then
            exit 0
          fi

          # What changed since the last release, one line per pull request: main takes only
          # squash merges, so each commit's first line is its pull request's title. No release
          # yet answers an empty list; a request that fails fails the job.
          previous="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          {
            printf '%s\n' \
              '## Install' \
              '' \
              'Download the archive for your system below, or:' \
              '' \
              '```sh' \
              "brew tap aureliolo/steamship https://github.com/${GH_REPO}" \
              'brew install aureliolo/steamship/steamship' \
              "scoop install https://github.com/${GH_REPO}/releases/download/${GITHUB_REF_NAME}/steamship.json" \
              'winget install Aureliolo.steamship' \
              "cargo install --locked steamship@${VERSION}" \
              '```' \
              '' \
              'Check an archive came from this repository'"'"'s release workflow:' \
              '' \
              '```sh' \
              "gh attestation verify <archive> --repo ${GH_REPO} --bundle steamship-${VERSION}.intoto.jsonl" \
              '```' \
              '' \
              '## Changes' \
              ''
            if [[ -n "${previous}" ]]; then
              gh api "repos/${GH_REPO}/compare/${previous}...${GITHUB_REF_NAME}" \
                --jq '.commits[].commit.message | split("\n")[0] | "- " + .'
            else
              echo '- The first release.'
            fi
          } > notes.md

          # Asked again after a failure, since GitHub has answered a create with a 500 after
          # making the draft. What the failed attempt left is looked at first.
          for attempt in 1 2 3; do
            if gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --notes-file notes.md \
              --title "steamship ${VERSION}"; then
              exit 0
            fi
            drop_unfinished_draft
            if already_released; then
              exit 0
            fi
            echo "Creating the release failed on attempt ${attempt}." >&2
            sleep 15
          done
          echo "The release could not be created in three attempts." >&2
          exit 1

  # The site, from this tag once its archives are out, so its version, links and command
  # reference are always the release's own.
  site:
    name: site
    if: github.repository == 'Aureliolo/steamship'
    needs: publish
    permissions:
      contents: read # Reads the tagged pages and the command line they are built from.
      pages: write # Only docs.yml's deploy job uses it, to publish.
      id-token: write # Only docs.yml's deploy job uses it; Pages verifies the deployment by it.
    uses: ./.github/workflows/docs.yml # zizmor: ignore[self-repository]
    with:
      publish: true

  # The action as a workflow in a game's repository uses it, from this tag on each system: it
  # installs the release just published, checked by SHA-256 and attestation, and uploads with a
  # login handed over. The login is an anonymous one, which Steam refuses a build, so the upload
  # fails; what this checks is that the action installs this release and runs it. That a login
  # handed over reaches Steam's refusal is checked in CI, with steamship built from source.
  action:
    name: action (${{ matrix.platform }})
    if: github.repository == 'Aureliolo/steamship'
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-26.04
          - platform: windows
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
          - platform: macos
            # renovate: datasource=github-runners depName=macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # Reads the tagged action and downloads the release it installs.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pack an anonymous login
        id: login
        run: |
          set -euo pipefail
          config="$(printf '"InstallConfigStore"\n{\n}\n' | od -An -tx1 | tr -d ' \n')"
          echo "packed=steamship-login-1:anonymous:${config}" >> "${GITHUB_OUTPUT}"

      # `./` for the action at this tag, as for release-build.yml above: actionlint rejects the
      # `$/...` form zizmor asks for.
      - name: Upload a preview with the action
        id: action
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository]
        with:
          script: tests/fixtures/spacewar/steam/app_build.vdf
          version: ${{ github.ref_name }}
          login: ${{ steps.login.outputs.packed }}
          preview: true

      - name: Check the action installed this release and ran it
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          program="$(find "${RUNNER_TEMP}/steamship-${version}" -type f \
            \( -name steamship -o -name steamship.exe \) | head -n 1)"
          test "$("${program}" --version)" = "steamship ${version}"
          test "${OUTCOME}" = failure

  # The formula and the Scoop manifest for this release, from the checksums as published, each
  # verified against the release's attestation the way a user's download would be.
  packages-write:
    name: packages (write)
    if: github.repository == 'Aureliolo/steamship'
    needs: [build, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the tagged script and the published release.

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write them from the release's signed checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          bundle="steamship-${VERSION}.intoto.jsonl"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release \
            --pattern '*.sha256' --pattern steamship.json --pattern "${bundle}"
          for subject in release/*.sha256 release/steamship.json; do
            gh attestation verify "${subject}" --bundle "release/${bundle}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml" \
              --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
          done
          .github/packages.sh "${VERSION}" release packages
          # The bucket and the release's own attachment are one manifest.
          cmp packages/bucket/steamship.json release/steamship.json

      - name: Upload them
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            packages/Formula/steamship.rb
            packages/bucket/steamship.json
          if-no-files-found: error
          retention-days: 1

  # Installed with Homebrew and Scoop from the files just written, before they go near main.
  packages-test:
    name: packages
    if: github.repository == 'Aureliolo/steamship'
    needs: packages-write
    permissions:
      contents: read # Reads the tagged workflow and the published release.
    # `./` as for release-build.yml above.
    uses: ./.github/workflows/packages.yml # zizmor: ignore[self-repository]
    with:
      files: packages
      tag: ${{ github.ref_name }}

  # The formula and the manifest land on main through a pull request that merges once every
  # required check has passed, with no one to approve anything. It is opened as the packaging
  # app because GitHub holds the checks of a pull request opened with the job token until
  # someone with write access approves them. An installation token lasts an hour, so one is made
  # for each change, and the waiting in between is done with the job token, which reads only.
  packages-main:
    name: packages (main)
    if: github.repository == 'Aureliolo/steamship'
    needs: [build, packages-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    # The app's key is a secret of this environment, which only release tags can deploy to.
    environment: packages
    permissions:
      contents: read # Reads the tagged scripts.
      pull-requests: read # Watches the pull request.
      checks: read # Reads its checks.
      statuses: read # Reads its commit statuses, if any.
      actions: read # Sees whether its checks are held for approval.
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download them
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - name: Refuse to go on without the packaging app
        env:
          CLIENT_ID: ${{ vars.PACKAGING_APP_CLIENT_ID }}
          KEY_SET: ${{ secrets.PACKAGING_APP_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ -z "${CLIENT_ID}" || "${KEY_SET}" != true ]]; then
            echo "::error::The packaging app is not set up: the variable PACKAGING_APP_CLIENT_ID and the secret PACKAGING_APP_KEY in the packages environment are needed. See .github/release-process.md." >&2
            exit 1
          fi

      - name: Act as the packaging app
        id: opener
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PACKAGING_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGING_APP_KEY }}
          repositories: steamship
          permission-contents: write
          permission-pull-requests: write

      - name: Open the pull request
        id: open
        env:
          GH_TOKEN: ${{ steps.opener.outputs.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: .github/packages-pr.sh open "${VERSION}" packages >> "${GITHUB_OUTPUT}"

      - name: Wait for its checks
        id: first
        if: steps.open.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.open.outputs.pr }}
        run: .github/packages-pr.sh wait "${PR}" >> "${GITHUB_OUTPUT}"

      - name: Act as the packaging app again
        id: merger
        if: steps.first.outputs.state == 'clean' || steps.first.outputs.state == 'behind'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PACKAGING_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGING_APP_KEY }}
          repositories: steamship
          permission-contents: write
          permission-pull-requests: write

      # Behind when main moved while the checks ran: the branch is brought up to date, which
      # runs them again.
      - name: Merge it, or bring it up to date
        if: steps.merger.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.merger.outputs.token }}
          PR: ${{ steps.open.outputs.pr }}
          STATE: ${{ steps.first.outputs.state }}
        run: .github/packages-pr.sh act "${PR}" "${STATE}"

      - name: Wait for its checks again
        id: second
        if: steps.first.outputs.state == 'behind'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.open.outputs.pr }}
        run: .github/packages-pr.sh wait "${PR}" >> "${GITHUB_OUTPUT}"

      - name: Act as the packaging app once more
        id: last
        if: steps.second.outputs.state == 'clean'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PACKAGING_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGING_APP_KEY }}
          repositories: steamship
          permission-contents: write
          permission-pull-requests: write

      - name: Merge it
        if: steps.last.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.last.outputs.token }}
          PR: ${{ steps.open.outputs.pr }}
        run: .github/packages-pr.sh act "${PR}" clean

      # Main moving twice while the checks ran is left to a re-run of this job, which picks the
      # pull request up where it is.
      - name: Check it merged
        if: steps.open.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.open.outputs.pr }}
        run: |
          set -euo pipefail
          state="$(gh pr view "${PR}" --json state --jq .state)"
          if [[ "${state}" != MERGED ]]; then
            echo "::error::Pull request #${PR} is ${state}, not merged: main moved twice while its checks ran. Re-run this job." >&2
            exit 1
          fi

  # winget takes packages only through a pull request to microsoft/winget-pkgs, which Microsoft's
  # wingetcreate opens from a fork with a classic token; GitHub lets no fine-grained token open
  # one. The token belongs to a machine account that owns nothing but that fork. The first version
  # is submitted by hand, since `update` needs one to exist; this job runs once the repository
  # variable WINGET is set to `submit`, after that one is accepted.
  winget:
    name: winget
    if: github.repository == 'Aureliolo/steamship' && vars.WINGET == 'submit'
    needs: [build, publish]
    runs-on: windows-2025
    timeout-minutes: 20
    # The token is a secret of this environment, which only release tags can deploy to.
    environment: winget
    permissions:
      contents: read # Reads the published release.
    defaults:
      run:
        shell: pwsh
    env:
      # renovate: datasource=github-release-attachments depName=microsoft/winget-create versioning=loose
      WINGETCREATE_TAG: v1.12.13.0
      WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea

    steps:
      - name: Refuse to go on without the token
        env:
          TOKEN_SET: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          if ($env:TOKEN_SET -ne 'true') {
            Write-Output '::error::WINGET is set to submit, but the secret WINGET_TOKEN is missing. See .github/release-process.md.'
            exit 1
          }

      - name: Download wingetcreate and check it
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/microsoft/winget-create/releases/download/$env:WINGETCREATE_TAG/wingetcreate.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wingetcreate.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\wingetcreate.exe").Hash.ToLowerInvariant()
          if ($hash -ne $env:WINGETCREATE_SHA256) { throw "wingetcreate.exe hashes to $hash, not the pinned $env:WINGETCREATE_SHA256." }

      # wingetcreate hashes the archive it downloads itself; the manifests are only sent once that
      # hash is the one the release is signed over. It carries the path of steamship.exe inside
      # the archive over from the last version, and that path names the version, so it is written
      # anew and checked against what the archive holds.
      - name: Write the manifests and check them against the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Only to read the current manifest from winget-pkgs; the job token reads and no more.
          WINGET_CREATE_GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $folder = "steamship-$env:VERSION-x86_64-pc-windows-msvc"
          $archive = "$folder.zip"
          $bundle = "steamship-$env:VERSION.intoto.jsonl"
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir release `
            --pattern $archive --pattern $bundle
          gh attestation verify "release/$archive" --bundle "release/$bundle" `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-build.yml" `
            --source-ref $env:GITHUB_REF --deny-self-hosted-runners
          $signed = (Get-FileHash -Algorithm SHA256 "release/$archive").Hash
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$archive"
          & "$env:RUNNER_TEMP\wingetcreate.exe" update Aureliolo.steamship --version $env:VERSION `
            --urls "$url|x64" --out manifests
          $installer = (Get-ChildItem manifests -Recurse -Filter 'Aureliolo.steamship.installer.yaml').FullName
          $written = (Select-String -Path $installer -Pattern 'InstallerSha256:\s*(\S+)').Matches[0].Groups[1].Value
          if ($written -ne $signed) { throw "wingetcreate wrote the hash $written, not the release's $signed." }
          $text = (Get-Content $installer -Raw) -replace `
            'RelativeFilePath:\s*steamship-[^\\/\s]+-x86_64-pc-windows-msvc[\\/]steamship\.exe', `
            "RelativeFilePath: $folder\steamship.exe"
          Set-Content -Path $installer -Value $text -NoNewline
          $path = (Select-String -Path $installer -Pattern 'RelativeFilePath:\s*(\S+)').Matches[0].Groups[1].Value
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "release/$archive").Path)
          $entries = $zip.Entries.FullName
          $zip.Dispose()
          if ($entries -notcontains ($path -replace '\\', '/')) { throw "The archive holds no $path." }

      - name: Submit them
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $folder = (Get-ChildItem manifests -Recurse -Filter 'Aureliolo.steamship.installer.yaml').DirectoryName
          & "$env:RUNNER_TEMP\wingetcreate.exe" submit --prtitle "New version: Aureliolo.steamship version $env:VERSION" `
            --no-open $folder

  # crates.io, through trusted publishing: the OIDC token below is the whole credential, and no
  # crates.io token exists anywhere. A crate nobody has published cannot have a trusted publisher
  # yet, so the first publish is done by hand and this job only runs once the repository variable
  # CRATES_IO is set to `publish`, after the publisher is configured.
  crates:
    name: crates
    if: github.repository == 'Aureliolo/steamship' && vars.CRATES_IO == 'publish'
    needs: [build, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read # Reads the tagged source it packages.
      id-token: write # Exchanged for a short-lived crates.io token.

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      # Before the token exists: packaging builds what would be uploaded, build scripts and all,
      # while there is no token in reach for any of them.
      - name: Package and check it builds
        run: cargo package --locked

      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # --no-verify: the package was built above, before the token existed; verifying again here
      # would run every build script with the token in reach.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
