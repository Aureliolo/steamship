# The .deb and .rpm, built by .github/linux-packages.sh from the Linux archive's own files, so
# they hold the very binary, man pages and completions the archive does.
name: steamship
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: devel
priority: optional
maintainer: Aurelio Amoroso <19254254+Aureliolo@users.noreply.github.com>
vendor: Aurelio Amoroso
homepage: https://github.com/Aureliolo/steamship
license: MIT OR Apache-2.0
description: |-
  Uploads game builds to Steam with Valve's steamcmd
  steamship runs Valve's own steamcmd with your app_build and depot_build scripts, sets steamcmd
  up pinned and verified, checks the scripts before anything is sent, reports the BuildID or the
  reason an upload failed, and never keeps a password.

# Valve's steamcmd for Linux is a 32-bit x86 program, which steamship installs and runs; these
# are the C libraries it loads.
overrides:
  deb:
    depends:
      - lib32gcc-s1
  rpm:
    depends:
      - glibc(x86-32)
      - libgcc(x86-32)

rpm:
  summary: Uploads game builds to Steam with Valve's steamcmd
  group: Development/Tools
  compression: zstd

contents:
  - src: ${STAGE}/steamship
    dst: /usr/bin/steamship
    expand: true
    file_info:
      mode: 0755
  - src: ${STAGE}/man/
    dst: /usr/share/man/man1/
    expand: true
    file_info:
      mode: 0644
  - src: ${STAGE}/completions/steamship.bash
    dst: /usr/share/bash-completion/completions/steamship
    expand: true
    file_info:
      mode: 0644
  - src: ${STAGE}/completions/steamship.fish
    dst: /usr/share/fish/vendor_completions.d/steamship.fish
    expand: true
    file_info:
      mode: 0644
  - src: ${STAGE}/completions/_steamship
    dst: /usr/share/zsh/vendor-completions/_steamship
    expand: true
    packager: deb
    file_info:
      mode: 0644
  - src: ${STAGE}/completions/_steamship
    dst: /usr/share/zsh/site-functions/_steamship
    expand: true
    packager: rpm
    file_info:
      mode: 0644
  - src: ${STAGE}/copyright
    dst: /usr/share/doc/steamship/copyright
    expand: true
    packager: deb
    file_info:
      mode: 0644
  - src: ${STAGE}/changelog.Debian.gz
    dst: /usr/share/doc/steamship/changelog.Debian.gz
    expand: true
    packager: deb
    file_info:
      mode: 0644
  - src: ${STAGE}/README.md
    dst: /usr/share/doc/steamship/README.md
    expand: true
    file_info:
      mode: 0644
  - src: ${STAGE}/LICENSE-APACHE
    dst: /usr/share/licenses/steamship/LICENSE-APACHE
    expand: true
    packager: rpm
    file_info:
      mode: 0644
  - src: ${STAGE}/LICENSE-MIT
    dst: /usr/share/licenses/steamship/LICENSE-MIT
    expand: true
    packager: rpm
    file_info:
      mode: 0644
