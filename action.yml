# The Marketplace refuses a name any GitHub account holds, and an organisation holds `steamship`.
name: Upload to Steam with steamship
description: Uploads a game build to Steam with Valve's steamcmd, logged in with the secret `steamship ci` set.
branding:
  icon: upload-cloud
  color: blue

inputs:
  script:
    description: The app build script, such as steam/app_build.vdf, from the repository's root; or give workshop instead.
    required: false
    default: ""
  version:
    description: The version being shipped, which with the commit becomes the build's description; needed with script.
    required: false
    default: ""
  workshop:
    description: A Workshop item's workshopitem script, such as workshop/item.vdf, to upload instead of a build.
    required: false
    default: ""
  new-item:
    description: Make a new Workshop item when the script names no publishedfileid, which is otherwise refused in CI.
    required: false
    default: "false"
  login:
    description: The login `steamship ci` set as a secret, passed as secrets.STEAMSHIP_LOGIN.
    required: true
  preview:
    description: Valve's dry run, which computes and logs the whole build and uploads nothing.
    required: false
    default: "false"

outputs:
  build-id:
    description: The BuildID Steam gave the upload; empty for a preview or a Workshop item.
    value: ${{ steps.upload.outputs.build-id }}
  published-file-id:
    description: The ID of the Workshop item uploaded; empty for a build.
    value: ${{ steps.upload.outputs.published-file-id }}

runs:
  using: composite
  steps:
    # The release this action is pinned to, from its own Cargo.toml, so that pinning the action
    # by commit pins the binary too. The archive is refused unless its SHA-256 matches and its
    # Sigstore attestation says steamship's release workflow built it from that tag.
    - name: Install steamship
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version="$(grep -m1 -E '^version = "' "${ACTION_PATH}/Cargo.toml" | cut -d '"' -f 2)"
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target=x86_64-linux-musl extension=tar.gz ;;
          Windows-X64) target=x86_64-pc-windows-msvc extension=zip ;;
          Windows-ARM64) target=aarch64-pc-windows-msvc extension=zip ;;
          macOS-ARM64) target=aarch64-apple-darwin extension=tar.gz ;;
          macOS-X64) target=x86_64-apple-darwin extension=tar.gz ;;
          *)
            echo "::error::steamship has no release for ${RUNNER_OS} on ${RUNNER_ARCH}."
            exit 1
            ;;
        esac
        name="steamship-${version}-${target}"
        folder="${RUNNER_TEMP}/steamship-${version}"
        mkdir -p "${folder}"
        gh release download "v${version}" --repo Aureliolo/steamship --dir "${folder}" --clobber \
          --pattern "${name}.${extension}" --pattern "${name}.${extension}.sha256"
        if command -v sha256sum > /dev/null; then
          (cd "${folder}" && sha256sum --check --strict "${name}.${extension}.sha256")
        else
          (cd "${folder}" && shasum -a 256 --check --strict "${name}.${extension}.sha256")
        fi
        gh attestation verify "${folder}/${name}.${extension}" --repo Aureliolo/steamship \
          --signer-workflow Aureliolo/steamship/.github/workflows/release-build.yml \
          --source-ref "refs/tags/v${version}" --deny-self-hosted-runners > /dev/null
        if [[ "${extension}" == zip ]]; then
          unzip -q -o "${folder}/${name}.zip" -d "${folder}"
          program="${folder}/${name}/steamship.exe"
        else
          tar -xzf "${folder}/${name}.tar.gz" -C "${folder}"
          program="${folder}/${name}/steamship"
        fi
        # Handed to the next step by name rather than put on the PATH, which every later step of
        # the job would search.
        echo "program=${program}" >> "${GITHUB_OUTPUT}"

    # A home of the job's own, into which the login is put back and from which it goes with the
    # job. steamship reads the secret from its environment, never from its command line.
    - name: Upload
      id: upload
      shell: bash
      env:
        STEAMSHIP: ${{ steps.install.outputs.program }}
        STEAMSHIP_LOGIN: ${{ inputs.login }}
        STEAMSHIP_HOME: ${{ runner.temp }}/steamship-home
        SCRIPT: ${{ inputs.script }}
        VERSION: ${{ inputs.version }}
        WORKSHOP: ${{ inputs.workshop }}
        NEW_ITEM: ${{ inputs.new-item }}
        PREVIEW: ${{ inputs.preview }}
      run: |
        set -euo pipefail
        if [[ -n "${SCRIPT}" && -n "${WORKSHOP}" ]] || [[ -z "${SCRIPT}" && -z "${WORKSHOP}" ]]; then
          echo "::error::Give either script, for a build, or workshop, for a Workshop item." >&2
          exit 2
        fi
        if [[ -n "${WORKSHOP}" ]]; then
          if [[ "${NEW_ITEM}" == true ]]; then
            "${STEAMSHIP}" workshop "${WORKSHOP}" --new
          else
            "${STEAMSHIP}" workshop "${WORKSHOP}"
          fi
        elif [[ -z "${VERSION}" ]]; then
          echo "::error::A build needs version, which with the commit becomes its description." >&2
          exit 2
        elif [[ "${PREVIEW}" == true ]]; then
          "${STEAMSHIP}" upload "${SCRIPT}" --version "${VERSION}" --preview
        else
          "${STEAMSHIP}" upload "${SCRIPT}" --version "${VERSION}"
        fi

    - name: Forget the login
      if: always()
      shell: bash
      run: rm -rf "${RUNNER_TEMP}/steamship-home"
